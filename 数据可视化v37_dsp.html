<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>简单数据可视化by RhycWu</title>
    <script src="./lib/echarts@560.min.js"></script>
    <script src="./lib/xlsx@0185.full.min.js"></script>
    <!-- 新增 js-dsp -->
    <script src="./lib/dsp.js"></script>
    <style>
        :root {
            --primary-color: #2196F3;
            --secondary-color: #4CAF50;
            --background: #f8f9fa;
            --text-primary: #2c3e50;
            --border-color: #e0e0e0;
        }

        .coefficient-group {
            margin-top: 10px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 4px;
        }

        .coefficient-group input[type="number"] {
            width: 80px;
            padding: 4px;
        }

        .control-panel {
            margin: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .type-selector {
            margin-bottom: 15px;
        }

        .file-input-group {
            display: none;
            margin-top: 6px;
        }

        .calculator-group {
            margin-top: 10px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 4px;
        }

        .calculator-group input[type="text"] {
            width: 300px;
            padding: 4px;
        }

        .calculator-group button {
            padding: 4px 8px;
            margin-left: 5px;
        }

        .operator-select {
            width: 50px;
            padding: 4px;
        }

        button {
            padding: 5px 5px;
            margin-right: 10px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #1976D2;
        }

        label {
            margin-right: 15px;
        }

        select,
        input[type="text"] {
            padding: 5px;
            margin: 5px 0;
        }

        .chart-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chart-box {
            width: 100%;
            height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }
    </style>
</head>

<body>
    <div class="control-panel">
        <div class="type-selector">
            <button id="btnTxt">📄 选择TXT</button>
            <button id="btnExcel">📂 选择Excel</button>
            <button id="btnMain">🏠 返回主图</button>
            <button id="btnExport">💾 数据导出</button>
        </div>
        <div class="file-input-group" id="txtGroup">
            <input type="file" id="txtInput" accept=".txt">
            <label>🔢 数据格式:
                <select id="dataFormatTxt">
                    <option value="hex">16进制</option>
                    <option value="dec">10进制</option>
                </select>
            </label>
            <label>#️⃣输入列索引(从0开始):
                <input type="text" id="txtColumns" placeholder="逗号分隔,留空默认前4列">
            </label>
            <label>🔀字节序：
                <select id="endianTxt">
                    <option value="big">🐘高位在前</option>
                    <option value="little">🐜低位在前</option>
                </select>
            </label>
            <label>🚩符号标志位：
                <input type="number" id="signBitTxt" placeholder="输入0~31,留空默认31">
            </label>
        </div>
        <div class="file-input-group" id="excelGroup">
            <input type="file" id="excelInput" accept=".xlsx,.xls">
            <label>🔢 数据格式:
                <select id="dataFormatExcel">
                    <option value="hex">16进制</option>
                    <option value="dec">10进制</option>
                </select>
            </label>
            <label>#️⃣输入列名:
                <input type="text" id="columns" placeholder="逗号分隔,留空默认前4列">
            </label>
            <label>🔀字节序：
                <select id="endianExcel">
                    <option value="big">🐘高位在前</option>
                    <option value="little">🐜低位在前</option>
                </select>
            </label>
            <label>🚩符号标志位：
                <input type="number" id="signBitExcel" placeholder="输入0~31,留空默认31">
            </label>
        </div>
        <div class="calculator-group">
            <label>⚖️数据系数：
                <input type="number" id="coefficient" value="1" step="0.1">
            </label>
            <label>💻 数据处理:
                <select id="dataOperation">
                    <option value="none">-- ？选择操作 --</option>
                    <option value="diff">📶Δ一阶差分</option>
                    <option value="movingAvg">📉μ滑动平均</option>
                    <option value="movingVar">📊σ²滑动均方差</option>
                    <option value="normalize">📏⇆归一化(0-1)</option>
                    <option value="cumsum">🧮∑累积和</option>
                    <option value="abs">🔢|x|绝对值</option>
                    <option value="fft">🌀ℱ傅里叶变换</option>
                    <option value="filter">🧲信号滤波</option>
                    <option value="minusAvg">📊数据中心化（去均值）</option>
                </select>
            </label>
            <!-- 滤波参数 -->
            <label id="filterTypeLabel" style="display:none;">
                滤波器类型:
                <select id="filterType">
                    <option value="lowpass">低通</option>
                    <option value="highpass">高通</option>
                    <option value="bandpass">带通</option>
                    <option value="bandstop">带阻</option>
                </select>
            </label>
            <label id="filterParamLabel" style="display:none;">
                F1:<input type="number" id="filterF1" value="100" style="width:60px;">Hz
                <span id="filterF2Span" style="display:none;">
                    F2:<input type="number" id="filterF2" value="200" style="width:60px;">Hz
                </span>
                阶数:<input type="number" id="filterOrder" value="4" min="1" max="8" style="width:40px;">
                采样率:<input type="number" id="filterFS" value="1000" style="width:60px;">Hz
            </label>
            <label style="display: none;" id="windowSizeLabel">
                📥 滑动窗口大小:
                <input type="number" id="windowSize" value="5" min="2" style="width: 60px;">
            </label>
            <label style="display: none;" id="sampleRateLabel">
                📡 采样率(Hz):
                <input type="number" id="sampleRate" value="1000" min="1" style="width: 80px;">
            </label>
            <label style="display: none;" id="fftDisplayLabel">
                📊 FFT显示:
                <select id="fftDisplayType">
                    <option value="magnitude">📈幅值</option>
                </select>
            </label>
            <label id="dbThresholdLabel" style="display: none;">
                📉 带宽阈值(dB):
                <input type="number" id="dbThreshold" value="3" min="1" max="20" style="width: 60px;">
            </label>
            <label style="display: none;" id="windowTypeLabel">
                🪟 窗函数:
                <select id="windowType">
                    <option value="hann">🏔️汉宁窗</option>
                    <option value="hamming">🔊汉明窗</option>
                    <option value="blackman">🎩 布莱克曼窗</option>
                    <option value="rect">⬜矩形窗(无窗)</option>
                </select>
            </label>
            <button id="btnApplyOperation">✅应用操作</button>
        </div>
    </div>
    <div class="chart-container">
        <div id="mainChart" class="chart-box"></div>
        <div id="calcChart" class="chart-box" style="display: none;"></div>
    </div>

    <script>



        // 直接定义 dataOperations，不用 worker
        const dataOperations = {
            filter: (data, params) => {
                let { type, f1, f2, order, fs } = params;
                let DSPType;
                if (type === "lowpass") DSPType = DSP.LOWPASS;
                else if (type === "highpass") DSPType = DSP.HIGHPASS;
                else if (type === "bandpass") DSPType = DSP.BANDPASS;
                else if (type === "bandstop") DSPType = DSP.NOTCH;
                let repeats = Math.max(1, Math.floor(order / 2));
                let filtered = data.slice();
                for (let i = 0; i < repeats; i++) {
                    let cutoff = (type === "bandpass" || type === "bandstop") ? (f1 + f2) / 2 : f1;
                    let Q = (type === "bandpass" || type === "bandstop") ? (cutoff / (f2 - f1)) : 1;
                    let filter = new Biquad(DSPType, fs);
                    filter.setQ(Q);
                    filter.setF0(cutoff);
                    filtered = Array.from(filter.process(filtered));
                }
                return filtered;
            },
            fft: (data, params) => {
                if (typeof FFT !== 'function' || typeof WindowFunction !== 'function') {
                    alert('dsp.js未加载，无法进行傅里叶变换');
                    return [];
                }
                // 补零到2的幂次方
                const nextPowerOfTwo = (data.length & (data.length - 1)) === 0
                    ? data.length
                    : Math.pow(2, Math.ceil(Math.log2(data.length)));
                const paddedData = [...data];
                while (paddedData.length < nextPowerOfTwo) paddedData.push(0);

                // 应用窗函数
                const windowType = params.windowType || 'hann';
                const windowFuncMap = {
                    hann: DSP.HANN,
                    hamming: DSP.HAMMING,
                    blackman: DSP.BLACKMAN,
                    rect: DSP.RECTANGULAR
                };
                const windowFunc = new WindowFunction(windowFuncMap[windowType] || DSP.HANN);
                const windowedData = windowFunc.process(paddedData.slice());

                // FFT
                const fft = new FFT(paddedData.length, params.fs || 1000);
                fft.forward(windowedData);

                // 只返回前半部分
                const spectrum = fft.spectrum || [];
                const validLength = Math.ceil(spectrum.length);
                let result = Array.from(spectrum).slice(0, validLength);
                params.paddedLength = paddedData.length;
                // 只支持幅值显示
                return result;
            },

            none: (data) => data,
            diff: (data) => data.slice(1).map((v, i) => v - data[i]),
            movingAvg: (data, window) => {
                let sum = 0, result = [];
                for (let i = 0; i < data.length; i++) {
                    sum += data[i];
                    if (i >= window) sum -= data[i - window];
                    result.push(sum / Math.min(window, i + 1));
                }
                return result;
            },
            movingVar: (data, window) => {
                let sum = 0, squareSum = 0, result = [];
                for (let i = 0; i < data.length; i++) {
                    sum += data[i];
                    squareSum += data[i] * data[i];
                    if (i >= window) {
                        sum -= data[i - window];
                        squareSum -= data[i - window] * data[i - window];
                    }
                    let mean = sum / Math.min(window, i + 1);
                    let variance = squareSum / Math.min(window, i + 1) - mean * mean;
                    result.push(variance);
                }
                return result;
            },
            normalize: (data) => {
                const min = Math.min(...data), max = Math.max(...data), range = max - min;
                return range === 0 ? data.map(() => 0) : data.map(v => (v - min) / range);
            },
            cumsum: (data) => { let sum = 0; return data.map(v => sum += v); },
            abs: (data) => data.map(v => Math.abs(v)),

            // 减去平均值（对输入数组先计算平均值，再逐点减去平均）
            minusAvg: (data) => {
                if (!data || !data.length) return [];
                let sum = 0;
                // 避免一次性展开过大数组导致性能问题，分块累加（与 updateChartInfo 保持一致风格）
                const batchSize = 10000;
                for (let i = 0; i < data.length; i += batchSize) {
                    const batch = data.slice(i, i + batchSize);
                    for (let j = 0; j < batch.length; j++) sum += batch[j];
                }
                const mean = sum / data.length;
                return data.map(v => v - mean);
            },
        };

        // ========== 应用状态 ==========
        const appState = {
            currentType: '',
            workbook: null,
            txtContent: null,
            mainData: [],
            calcData: [],
            zoomStates: { main: { start: 0, end: 100 }, calc: { start: 0, end: 100 } },
            selection: { A: null, B: null, current: null },
            coefficient: 1,
            currentChartType: 'main',
            currentOperation: '',
            windowSize: 5,
            fftInfo: { paddedLength: 0 }
        };
        const BYTE_COUNT = 4, DEFAULT_SIGN_BIT = 31;
        const mainChart = echarts.init(document.getElementById('mainChart'));

        // ========== 参数区动态UI（包含滤波） ==========
        document.getElementById('dataOperation').addEventListener('change', function () {
            // FFT参数区
            const isFFT = this.value === 'fft';
            document.getElementById('sampleRateLabel').style.display = isFFT ? 'inline-block' : 'none';
            document.getElementById('fftDisplayLabel').style.display = isFFT ? 'inline-block' : 'none';
            document.getElementById('dbThresholdLabel').style.display = isFFT ? 'inline-block' : 'none';

            const needsWindow = ['movingAvg', 'movingVar'].includes(this.value);
            document.getElementById('windowSizeLabel').style.display = needsWindow ? 'inline-block' : 'none';
            document.getElementById('windowTypeLabel').style.display = isFFT ? 'inline-block' : 'none';
            // 滤波参数区
            if (this.value === 'filter') {
                document.getElementById('filterTypeLabel').style.display = '';
                document.getElementById('filterParamLabel').style.display = '';
            } else {
                document.getElementById('filterTypeLabel').style.display = 'none';
                document.getElementById('filterParamLabel').style.display = 'none';
            }
        });
        document.getElementById('filterType').addEventListener('change', function () {
            let tp = this.value;
            document.getElementById('filterF2Span').style.display = (tp === 'bandpass' || tp === 'bandstop') ? '' : 'none';
        });

        // ========== 主页面逻辑 ==========
        function bindInputs(ids, handler) { ids.forEach(id => document.getElementById(id).addEventListener('input', handler)); }
        function bindClicks(ids, handler) { ids.forEach(id => document.getElementById(id).addEventListener('click', handler)); }

        function initEventListeners() {
            bindClicks(['btnTxt', 'btnExcel'], e => {
                const type = e.target.id.replace('btn', '').toLowerCase();
                showFileInput(type); showMainChart();
            });
            document.getElementById('txtInput').addEventListener('change', handleTxtFile);
            document.getElementById('excelInput').addEventListener('change', handleExcelFile);
            bindInputs(['columns', 'endianExcel', 'signBitExcel'], reloadData);
            bindInputs(['txtColumns', 'endianTxt', 'signBitTxt'], reloadData);
            bindInputs(['dataFormatTxt', 'dataFormatExcel'], reloadData);
            bindClicks(['btnMain', 'btnExport'], e => {
                switch (e.target.id) {
                    case 'btnMain': showMainChart(); break;
                    case 'btnExport': exportCurrentData(); break;
                }
            });

            document.getElementById('btnApplyOperation').addEventListener('click', function () {
                // 重置数据处理图（calcChart）的缩放范围
                appState.zoomStates.calc = { start: 0, end: 100 };
                showCalcChart();
            });
            bindInputs(['coefficient'], reloadData);


        }

        function showFileInput(type) {
            appState.currentType = type;
            document.querySelectorAll('.file-input-group').forEach(el => el.style.display = 'none');
            document.getElementById(`${type}Group`).style.display = 'block';
            document.getElementById(`${type}Input`).value = '';
            appState.workbook = null;
            appState.txtContent = null;
            mainChart.clear();
        }

        function handleTxtFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                let content = e.target.result;
                const lines = content.trim().split('\n');
                const shouldReprocess = lines.length === 1 || lines.some(line => line.trim() === '');
                if (shouldReprocess) {
                    const userInput = prompt("检测到单行或存在空行数据，请输入每行的元素个数（大于1）:", "2");
                    const n = parseInt(userInput);
                    if (isNaN(n) || n < 2) { alert("输入无效，必须输入大于1的整数"); return; }
                    const allElements = lines.map(line => line.trim()).filter(line => line !== '').join(' ').split(/\s+/).filter(element => element !== '');
                    const chunked = []; for (let i = 0; i < allElements.length; i += n) {
                        const chunk = allElements.slice(i, i + n);
                        if (chunk.length === n) chunked.push(chunk.join(' '));
                    }
                    content = chunked.join('\n');
                    const blob = new Blob([content], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url;
                    const timestamp = new Date().toISOString().replace(/[-:.]/g, '').slice(0, 14);
                    a.download = `processed_${timestamp}.txt`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }
                appState.txtContent = content;
                reloadData();
            };
            reader.readAsText(file);
        }

        function handleExcelFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    appState.workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    reloadData();
                } catch (error) { alert(`文件读取失败: ${error.message}`); }
            };
            reader.readAsArrayBuffer(file);
        }




        function columnToIndex(col) {
            // 支持字母列名和数字
            if (/^\d+$/.test(col)) return Number(col);
            return col.toUpperCase().split('').reduce((acc, c) => acc * 26 + (c.charCodeAt(0) - 64), 0) - 1;
        }

        function processCellValue(cell, isDecimal) {
            if (isDecimal) {
                // 如果是数字类型，直接返回
                if (typeof cell === 'number') return cell;
                // 如果是字符串，直接parseFloat（支持负号和小数点）
                return parseFloat(cell);
            } else {
                // 只保留HEX字符，补齐两位
                return String(cell)
                    .replace(/[^0-9A-Fa-f]/g, '')
                    .padStart(2, '0')
                    .toUpperCase()
                    .slice(-2);
            }
        }

        function processBytes(values, byteCount, isBigEndian) {
            const bytes = values.slice(0, byteCount);
            if (bytes.length < byteCount) {
                bytes.unshift(...Array(byteCount - bytes.length).fill('00'));
            }
            return isBigEndian ? bytes : bytes.reverse();
        }

        function applySign(value, signBit) {
            return (value >> signBit) & 1 ? -(2 ** (signBit + 1)) + value : value;
        }

        function processCommonData(selectedValues, byteCount, isBigEndian, signBit, isDecimal) {
            const coefficient = parseFloat(document.getElementById('coefficient').value) || 1;
            if (isDecimal) {
                // 只取第一个有效数字
                const nums = selectedValues.map(v => typeof v === 'number' ? v : parseFloat(v)).filter(x => !isNaN(x));
                const rawValue = nums.length ? nums[0] : NaN;
                return rawValue * coefficient;
            } else {
                const bytes = processBytes(selectedValues, byteCount, isBigEndian);
                const value = parseInt(bytes.join(''), 16);
                const rawValue = applySign(value, signBit);
                return rawValue * coefficient;
            }
        }

        let data = [], rawTextData = [];// RhycWu20250722 
        appState.mainData = data;// RhycWu20250722 
        appState.rawTextData = rawTextData;// RhycWu20250722 

        function reloadData() {
            if (!appState.currentType) return;
            try {
                let data = [];
                if (appState.currentType === 'excel') {
                    const workbook = appState.workbook;
                    const sheetName = workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];
                    const rawData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

                    const isDecimal = document.getElementById('dataFormatExcel').value === 'dec';

                    // let columns = document.getElementById('columns').value.split(',').map(c => c.trim()).filter(c => c !== '');
                    // 万能索引解析：支持空格、中英文逗号、顿号、分号
                    let columns = document.getElementById('columns').value .replace(/[，、；;,\s]+/g, ' ') .trim().split(' ') .map(c => c.trim()).filter(c => c !== '');

                    if (columns.length === 0) columns = rawData[0].slice(0, 4).map((_, idx) => idx);
                    const colIndexes = columns.map(columnToIndex);
                    const isBigEndian = document.getElementById('endianExcel').value === 'big';
                    const signBit = parseInt(document.getElementById('signBitExcel').value, 10) || DEFAULT_SIGN_BIT;

                    for (let i = 1; i < rawData.length; i++) {
                        const row = rawData[i];
                        const selected = (colIndexes.length ? colIndexes : [0, 1, 2, 3])
                            .map(idx => processCellValue(row[idx] || '00', isDecimal));
                        data.push(processCommonData(selected, BYTE_COUNT, isBigEndian, signBit, isDecimal));

                        // 新增：保存原始文本（拼接所选列）
                        rawTextData.push(colIndexes.map(idx => row[idx]).join(' '));// RhycWu20250722 
                    }
                } else if (appState.currentType === 'txt') {
                    const lines = appState.txtContent.split(/\r?\n/);
                    const isDecimal = document.getElementById('dataFormatTxt').value === 'dec';

                    // let columns = document.getElementById('txtColumns').value.split(',').map(c => c.trim()).filter(c => c !== '');

                    // 万能索引解析：支持空格、中英文逗号、顿号、分号
                    let columns = document.getElementById('txtColumns').value .replace(/[，、；;,\s]+/g, ' ') .trim().split(' ') .map(c => c.trim()).filter(c => c !== '');

                    if (columns.length === 0) columns = [0, 1, 2, 3];
                    const isBigEndian = document.getElementById('endianTxt').value === 'big';
                    const signBit = parseInt(document.getElementById('signBitTxt').value, 10) || DEFAULT_SIGN_BIT;

                    for (let line of lines) {
                        const items = line.split(/\s+/);
                        const selected = (columns.length ? columns : [0, 1, 2, 3])
                            .map(idx => processCellValue(items[idx] || '00', isDecimal));
                        data.push(processCommonData(selected, BYTE_COUNT, isBigEndian, signBit, isDecimal));


                        // 新增：保存原始文本
                        rawTextData.push(line.trim());// RhycWu20250722 
                    }
                }
                appState.mainData = data;
                renderMainChart();
                if (appState.currentChartType === 'calc') showCalcChart();
            } catch (error) {
                alert(`数据处理失败: ${error.message}`);
            }
        }



        function showCalcChart() {
            if (!appState.mainData.length) return;
            appState.currentChartType = 'calc';
            const { start, end } = appState.zoomStates.calc;
            const startIndex = Math.floor(appState.mainData.length * start / 100);
            const endIndex = Math.ceil(appState.mainData.length * end / 100);
            const visibleMainData = appState.mainData.slice(startIndex, endIndex);

            const operation = document.getElementById('dataOperation').value;
            appState.currentOperation = operation;

            let result = [];
            if (["fft", "diff", "movingAvg", "movingVar", "normalize", "cumsum", "abs", "filter", "minusAvg"].includes(operation)) {
                if (operation === "fft") {
                    let fftParams = {

                        windowType: document.getElementById('windowType').value,
                        fs: parseFloat(document.getElementById('sampleRate').value) || 1000
                    };
                    // 修正：FFT输入必须是全数据
                    result = dataOperations.fft(appState.mainData, fftParams);
                    appState.fftInfo.paddedLength = fftParams.paddedLength || result.length;
                } else if (operation === "filter") {
                    let filterParams = {
                        type: document.getElementById('filterType').value,
                        f1: parseFloat(document.getElementById('filterF1').value) || 100,
                        f2: parseFloat(document.getElementById('filterF2').value) || 200,
                        order: parseInt(document.getElementById('filterOrder').value) || 4,
                        fs: parseFloat(document.getElementById('filterFS').value) || 1000
                    };
                    result = dataOperations.filter(visibleMainData, filterParams);
                } else if (operation === "movingAvg" || operation === "movingVar") {
                    let windowSize = parseInt(document.getElementById('windowSize').value) || 5;
                    result = dataOperations[operation](visibleMainData, windowSize);
                } else {
                    result = dataOperations[operation](visibleMainData);
                }
                appState.calcData = result;
                // 修正：只显示处理后数据
                mainChart.setOption(getChartOption(appState.calcData, 'calc'), true);
                updateChartInfo(appState.calcData, start, end, mainChart);
                initChartEvents(mainChart, 'calc');
                return;
            }
        }

        const origGetChartOption = function (data, type = 'main') {
            const isMain = type === 'main';
            const isCalc = type === 'calc';
            const isFFT = appState.currentOperation === 'fft';
            const isLarge = data.length > 30000;

            // x轴数据长度取最大，保证两条线对齐
            const maxLen = Math.max(appState.mainData.length, appState.calcData.length);
            let xAxisData;
            if (isFFT) {
                const sampleRate = parseFloat(document.getElementById('sampleRate').value) || 1000;
                const N = appState.fftInfo.paddedLength || appState.calcData.length;
                const freqResolution = sampleRate / N;
                xAxisData = Array.from({ length: appState.calcData.length }, (_, i) => (i * freqResolution).toFixed(2) + 'Hz');
            } else {
                xAxisData = Array.from({ length: maxLen }, (_, i) => i + 1);
            }

            let yAxisName;
            if (isFFT) {
                const displayType = document.getElementById('fftDisplayType').value;
                yAxisName = '📈幅度';
            } else {
                yAxisName = isMain ? '🧸数值(十进制)' : '🐎计算结果';
            }

            // series始终包含两条线，图例按钮始终可用
            const series = [
                {
                    type: 'line',
                    name: '原始数据',
                    data: appState.mainData.slice(0, xAxisData.length),
                    large: isLarge,
                    largeThreshold: 10000,
                    progressive: 100000,
                    animation: false,
                    smooth: false,
                    lineStyle: { width: 1.5, color: '#2196F3' },
                    symbol: data.length > 5000 ? 'none' : 'circle',
                    symbolSize: 3,
                    markPoint: !isLarge ? {
                        data: [
                            { type: 'max', name: '最大值', itemStyle: { color: 'red' } },
                            { type: 'min', name: '最小值', itemStyle: { color: 'green' } }
                        ]
                    } : undefined
                },
                {
                    type: 'line',
                    name: '处理后数据',
                    data: appState.calcData.slice(0, xAxisData.length),
                    large: true,
                    progressive: 500,
                    animation: false,
                    smooth: false,
                    lineStyle: { width: 1.5, color: '#F44336' },
                    symbol: 'circle',
                    symbolSize: 3
                }
            ];

            return {
                title: {
                    text: isMain ? '🪬32位HEX数据可视化' :
                        isFFT ? '📊 傅里叶变换结果' : '💻 数据处理结果',
                    subtext: isMain ? getSubtitle() :
                        isFFT ? `频域分析` : `操作: ${appState.currentOperation} | 窗口大小: ${appState.windowSize}`,
                    left: 'center'
                },
                xAxis: {
                    type: 'category',
                    name: isMain ? '🎰行号' :
                        isFFT ? '📡频率(Hz)' : '🔢计算序号',
                    data: xAxisData,
                    axisLabel: { rotate: 45 }
                },
                yAxis: {
                    type: 'value',
                    name: yAxisName,
                },
                series: series,
                dataZoom: [{
                    type: 'slider',
                    start: appState.zoomStates[type].start,
                    end: appState.zoomStates[type].end,
                    fillerColor: `rgba(${isMain ? '33,150,243' : '76,175,80'},0.2)`,
                    realtime: true
                }, {
                    type: 'inside',
                    zoomOnMouseWheel: true
                }],
                tooltip: {
                    trigger: 'axis',
                    formatter: params => {
                        let result = [];
                        params.forEach(param => {
                            const { seriesName, dataIndex, value } = param;
                            if (isFFT) {
                                const sampleRate = parseFloat(document.getElementById('sampleRate').value) || 1000;
                                const freqResolution = sampleRate / (appState.fftInfo.paddedLength || appState.calcData.length);
                                const freq = (dataIndex * freqResolution).toFixed(2);
                                result.push(`${seriesName}<br/>频率: ${freq}Hz<br/>幅度: ${value}`);
                            } else {
                                // result.push(`${seriesName}<br/>序号: ${dataIndex + 1}<br/>值: ${value}`);
                                // RhycWu20250722 
                                if (seriesName === '原始数据') {
                                    const raw = appState.rawTextData && appState.rawTextData[dataIndex] !== undefined
                                        ? appState.rawTextData[dataIndex]
                                        : value;
                                    result.push(`${seriesName}<br/>序号: ${dataIndex + 1}<br/>原始: ${raw}<br/>值: ${value}`);
                                } else {
                                    result.push(`${seriesName}<br/>序号: ${dataIndex + 1}<br/>值: ${value}`);
                                }
                                // RhycWu20250722 
                            }
                        });
                        return result.join('<br/>');
                    }
                },
                legend: {
                    data: ['原始数据', '处理后数据'],
                    right: 10,
                    top: 10
                },
                toolbox: {
                    feature: {
                        saveAsImage: { title: '💾保存' },
                        dataZoom: { title: { zoom: '🔍缩放', back: '↩️还原' } },
                        restore: { title: '🔄重置' }
                    },
                    itemSize: 15,
                    itemGap: 10,
                    left: 20,
                    top: 20,
                    orient: 'vertical'
                },
                graphic: {
                    type: 'text',
                    right: 20,
                    top: 100,
                    style: {
                        text: '',
                        fill: '#666',
                        fontSize: 12,
                        lineHeight: 18
                    },
                    z: 100
                }
            };
        };





        function getChartOption(data, type = 'main') {
            const option = origGetChartOption(data, type);
            const isFFT = appState.currentOperation === 'fft' && appState.calcData.length > 16;
            if (isFFT) {
                const sampleRate = parseFloat(document.getElementById('sampleRate').value) || 1000;
                const N = appState.fftInfo.paddedLength || appState.calcData.length;
                const freqRes = sampleRate / N;
                // 主峰索引必须在全频域数据上找
                let spectrum = appState.calcData;
                let max = -Infinity, maxIdx = 0;
                for (let i = 0; i < spectrum.length; i++) if (spectrum[i] > max) max = spectrum[i], maxIdx = i;

                // 主峰频率
                const truePeakFreq = (maxIdx * freqRes).toFixed(2);

                // 带宽阈值(dB) -3dB带宽计算也用全频域索引
                const dbValue = parseFloat(document.getElementById('dbThreshold').value) || 3;
                let half = max / Math.pow(10, dbValue / 20), left = maxIdx, right = maxIdx;
                while (left > 0 && spectrum[left] > half) left--;
                while (right < spectrum.length - 1 && spectrum[right] > half) right++;

                if (!option.series) option.series = [];
                if (!option.series[1]) option.series[1] = { type: 'line', data: [] };
                option.series[1].markPoint = {
                    data: [
                        { coord: [maxIdx, max], name: "主峰", value: `主峰 ${truePeakFreq}Hz`, itemStyle: { color: 'red' } }
                    ]
                };
                option.series[1].markLine = {
                    data: [
                        { xAxis: left, lineStyle: { type: 'dashed', color: '#ffa726' }, label: { formatter: `-${dbValue}dB左` } },
                        { xAxis: right, lineStyle: { type: 'dashed', color: '#ffa726' }, label: { formatter: `-${dbValue}dB右` } }
                    ]
                };
            }
            return option;
        }

        function renderMainChart() {
            const option = getChartOption(appState.mainData, 'main');
            mainChart.setOption(option, true);
            initChartEvents(mainChart, 'main');
            updateChartInfo(appState.mainData, 0, 100, mainChart);
        }
        function showMainChart() {
            appState.currentChartType = 'main';
            appState.currentOperation = '';
            appState.calcData = [];
            document.getElementById('calcChart').style.display = 'none';
            document.getElementById('mainChart').style.display = 'block';
            appState.zoomStates.main = { start: 0, end: 100 }; // 重置主图的缩放范围
            mainChart.setOption(getChartOption(appState.mainData, 'main'), true);
            updateChartInfo(appState.mainData, appState.zoomStates.main.start, appState.zoomStates.main.end, mainChart);
            setTimeout(() => mainChart.resize(), 0);
            initChartEvents(mainChart, 'main');
        }

        function updateChartInfo(data, start, end, chart) {
            if (!data.length) return;

            const startIndex = Math.floor(data.length * start / 100);
            const endIndex = Math.ceil(data.length * end / 100);
            const visibleData = data.slice(startIndex, endIndex);

            const calculateStats = (arr) => {
                let max = -Infinity;
                let min = Infinity;
                let sum = 0;
                let sumSq = 0;
                const batchSize = 10000;
                for (let i = 0; i < arr.length; i += batchSize) {
                    const batch = arr.slice(i, i + batchSize);
                    for (let j = 0; j < batch.length; j++) {
                        const val = batch[j];
                        max = Math.max(max, val);
                        min = Math.min(min, val);
                        sum += val;
                        sumSq += val * val;
                    }
                }
                const count = arr.length;
                const avg = count ? sum / count : 0;
                const variance = count ? (sumSq / count) - (avg * avg) : 0;
                const stdDev = Math.sqrt(variance);
                const cv = avg ? (stdDev / avg * 100).toFixed(8) : "0.00000000";

                return { max, min, avg, cv, range: max - min };
            };

            const isFFTView = appState.currentOperation === 'fft';
            let infoText;

            if (isFFTView) {
                const sampleRate = parseFloat(document.getElementById('sampleRate').value) || 1000;
                const N = appState.fftInfo.paddedLength || appState.calcData.length;
                const freqResolution = sampleRate / N;
                const spectrum = appState.calcData;
                const stats = calculateStats(visibleData);
                // 频率范围用窗口内的索引
                const freqStart = (startIndex * freqResolution).toFixed(2);
                const freqEnd = (endIndex * freqResolution).toFixed(2);
                // 主频分量用窗口内最大值的全局索引
                const globalMaxIdx = startIndex + visibleData.indexOf(stats.max);
                const maxFreq = (globalMaxIdx * freqResolution).toFixed(2);

                const displayType = document.getElementById('fftDisplayType').value;
                const yAxisName = '幅度';

                const windowType = document.getElementById('windowType').value;
                const windowNames = {
                    'hann': '汉宁窗',
                    'hamming': '汉明窗',
                    'blackman': '布莱克曼窗',
                    'rect': '矩形窗'
                };

                infoText = [
                    `🪟 窗函数: ${windowNames[windowType]}`,
                    `🐉频率范围: ${freqStart}-${freqEnd}Hz`,
                    '─────────',
                    `🐦最大值: ${stats.max.toFixed(4).padStart(11)} ${yAxisName}`,
                    `📡主频分量: ${maxFreq}Hz`,
                    '─────────',
                    `🔊平均值: ${stats.avg.toFixed(4).padStart(11)} ${yAxisName}`
                ].filter(line => line !== '').join('\n');
            } else {
                // 非FFT视图：如果当前是 calc 视图，额外计算并显示对应主图（原始数据）窗口的统计，避免百分比与长度不一致导致误解
                const statsCalc = calculateStats(visibleData);
                if (appState.currentChartType === 'calc') {
                    const mainStartIndex = Math.floor(appState.mainData.length * start / 100);
                    const mainEndIndex = Math.ceil(appState.mainData.length * end / 100);
                    const mainVisible = appState.mainData.slice(mainStartIndex, mainEndIndex);
                    const statsMain = calculateStats(mainVisible);
                    infoText = [
                        `🐉数据范围(主图索引): ${mainStartIndex + 1}-${mainEndIndex}`,
                        '─────────',
                        `🐦原始最大: ${statsMain.max.toFixed(BYTE_COUNT).padStart(11)}`,
                        `🐛原始最小: ${statsMain.min.toFixed(BYTE_COUNT).padStart(11)}`,
                        `📊原始平均: ${statsMain.avg.toFixed(BYTE_COUNT).padStart(11)}`,
                        '─────────',
                        `🐦处理后最大: ${statsCalc.max.toFixed(BYTE_COUNT).padStart(11)}`,
                        `🐛处理后最小: ${statsCalc.min.toFixed(BYTE_COUNT).padStart(11)}`,
                        `📊处理后平均: ${statsCalc.avg.toFixed(BYTE_COUNT).padStart(11)}`
                    ].join('\n');
                } else {
                    const stats = statsCalc;
                    infoText = [
                        `🐉数据范围: ${startIndex + 1}-${endIndex}`,
                        '─────────',
                        `🐦最大值: ${stats.max.toFixed(BYTE_COUNT).padStart(11)}`,
                        `🐛最小值: ${stats.min.toFixed(BYTE_COUNT).padStart(11)}`,
                        `📊平均值: ${stats.avg.toFixed(BYTE_COUNT).padStart(11)}`,
                        `📈变异系数: ${stats.cv}%`.padStart(14),
                        '─────────',
                        `🎯差值Δ: ${stats.range.toFixed(BYTE_COUNT).padStart(11)}`
                    ].join('\n');
                }
            }
            chart.setOption({
                graphic: {
                    style: {
                        text: visibleData.length ? infoText : '无数据',
                    }
                }
            });
        }
        function initChartEvents(chartInstance, type) {
            chartInstance.off('datazoom');
            chartInstance.off('restore');

            chartInstance.on('datazoom', params => {
                const option = chartInstance.getOption();
                let start = 0, end = 100;
                if (option.dataZoom && option.dataZoom.length) {
                    option.dataZoom.forEach(dz => {
                        if (dz.start !== undefined) start = dz.start;
                        if (dz.end !== undefined) end = dz.end;
                    });
                }
                appState.zoomStates[type] = { start, end };
                if (type === 'main') {
                    updateChartInfo(appState.mainData, start, end, mainChart);
                    if (appState.currentChartType === 'calc') showCalcChart();
                } else {
                    updateChartInfo(appState.calcData, start, end, mainChart);
                }
            });

            // === Restore：保证全局一致，还原区间和数据，并只显示当前的视图 ===
            chartInstance.on('restore', function () {
                appState.zoomStates[type] = { start: 0, end: 100 };

                // 只重置当前类型（main/calc），隐藏副图，主图视图同步
                if (type === 'main') {
                    appState.currentChartType = 'main';
                    appState.calcData = [];
                    document.getElementById('calcChart').style.display = 'none';
                    document.getElementById('mainChart').style.display = 'block';
                    mainChart.setOption(getChartOption(appState.mainData, 'main'), true);
                    updateChartInfo(appState.mainData, 0, 100, mainChart);
                } else if (type === 'calc') {
                    appState.currentChartType = 'calc';
                    document.getElementById('mainChart').style.display = 'block';
                    document.getElementById('calcChart').style.display = 'none';
                    // 你主副图本来就都在 mainChart 上渲染的，所以这里直接刷新
                    mainChart.setOption(getChartOption(appState.mainData, 'main'), true);
                    updateChartInfo(appState.mainData, 0, 100, mainChart);
                }
            });
        }
        function exportCurrentData() {
            try {
                const data = appState.currentChartType === 'main' ? appState.mainData : appState.calcData;
                if (!data.length) { alert('没有可导出的数据'); return; }
                const wsData = [
                    ['序号', '数值'],
                    ...data.map((value, index) => [index + 1, value])
                ];
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
                const timestamp = new Date().toISOString().replace(/[-:.]/g, '').slice(0, 14);
                const chartType = appState.currentChartType === 'main' ? '原始数据' : appState.currentOperation;
                const windowSize = appState.currentChartType === 'main' ? '' : `_窗口${appState.windowSize}`;
                XLSX.writeFile(wb, `数据导出_${chartType}${windowSize}_${timestamp}.xlsx`);
            } catch (error) {
                alert(`Excel导出失败: ${error.message}`); console.error(error);
            }
        }
        function getSubtitle() {
            const isExcel = appState.currentType === 'excel';
            return [
                `😊系数x：${document.getElementById('coefficient').value}`,
                `数据格式：${document.getElementById(isExcel ? 'dataFormatExcel' : 'dataFormatTxt').value === 'hex' ? '16进制' : '10进制'}`,
                `字节序：${document.getElementById(isExcel ? 'endianExcel' : 'endianTxt').value === 'big' ? '高位' : '低位'}`,
                `符号标志位：${document.getElementById(isExcel ? 'signBitExcel' : 'signBitTxt').value || '31'}`,
                `选择列：${document.getElementById(isExcel ? 'columns' : 'txtColumns').value || '前4列'}`
            ].join(' | ');
        }

        // ========== 启动 ==========
        function init() {
            initEventListeners();
            initChartEvents(mainChart, 'main');
        }
        init();

    </script>
</body>
