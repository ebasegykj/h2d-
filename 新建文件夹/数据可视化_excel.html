<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Excel数据可视化by Rhycwu</title>
    <script src="./lib/echarts@560.min.js"></script>
    <script src="./lib/xlsx@0185.full.min.js"></script>
    <!-- <script src="./lib/echarts@542.min.js"></script> -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js"></script> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.2/dist/echarts.min.js"></script> -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script> -->
    <style>
        .control-panel {
            margin: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .control-group {
            margin: 10px 0;
        }

        label {
            margin-right: 15px;
            display: inline-block;
            width: 120px;
        }

        input[type="text"] {
            padding: 4px; /* 设置文本输入框的填充和宽度 */
            width: 200px; /* 设置宽度*/
        }

        select {
            padding: 4px;
        }
    </style>
</head>

<body>
    <div class="control-panel">
        <div class="control-group" style="display: inline-block;">
            <label>选择Excel文件：</label>
            <input type="file" id="fileInput" accept=".xlsx,.xls">
        </div>
        <div class="control-group" style="display: inline-block;">
            <label style="white-space: nowrap;">选择列：如A,B,C</label>
            <input type="text" id="columns" placeholder="如A,B,C,D留空使用前4列">
        </div>
        <div class="control-group" style="display: inline-block;">
            <label>字节序选择：</label>
            <select id="endianSelect">
                <option value="big">大端模式</option>
                <option value="little">小端模式</option>
            </select>
        </div>
    </div>
    <div class="control-panel">
        <div class="control-group" style="display: inline-flex; gap: 400px;">
        <!-- <div class="control-group" style="display: inline-flex; gap: 400px; align-items: center; overflow-x: auto; max-width: 100%;"> -->
            <label  style="white-space: nowrap;">示例行1：如读取B列和E列数据 补零后格式：[B列值, E列值, 00, 00]→ 0xBBEE0000（大端模式）→0x0000EEBB（小端模式）：</label>
            <!-- <label  style="white-space: nowrap;">示例行1：[FF, 34, 00, 00] → 0xFF340000（大端模式）：</label> -->
        </div>
    </div>
    <div id="chart" style="width: 1200px; height: 600px;"></div>

    <script>
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom);
        let workbookData = null;

        // 初始化控件事件
        document.getElementById('fileInput').addEventListener('change', handleFile);
        document.getElementById('endianSelect').addEventListener('change', reloadData);
        document.getElementById('columns').addEventListener('change', reloadData);

        // Excel文件处理
        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    workbookData = XLSX.read(data, { type: 'array' });
                    reloadData();
                } catch (error) {
                    alert(`文件读取失败: ${error.message}`);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 重新加载数据
        function reloadData() {
            if (!workbookData) return;
            try {
                const processedData = processWorkbook();
                renderChart(processedData);
            } catch (error) {
                alert(`数据处理失败: ${error.message}`);
            }
        }

        // 列字母转数字索引（A=0, B=1,...）
        function columnToIndex(col) {
            col = col.toUpperCase();
            let index = 0;
            for (let i = 0; i < col.length; i++) {
                index = index * 26 + (col.charCodeAt(i) - 64);
            }
            return index - 1;
        }

        // 解析用户选择的列
        function parseSelectedColumns() {
            const input = document.getElementById('columns').value.trim();
            if (!input) return null;

            try {
                return input.split(',')
                    .map(c => c.trim().replace(/[^A-Za-z]/g, ''))
                    .filter(c => c.length > 0)
                    .map(columnToIndex)
                    .filter(index => index >= 0);
            } catch {
                return null;
            }
        }

        // 处理工作簿数据
        function processWorkbook() {
            const sheet = workbookData.Sheets[workbookData.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(sheet, {
                header: 1,
                defval: "",
                blankrows: false
            });

            // 获取选择的列索引
            const selectedCols = parseSelectedColumns();
            const useDefaultCols = !selectedCols || selectedCols.length === 0;
            const maxCol = Math.max(...jsonData.map(row => row.length)) - 1;

            // 生成有效列索引
            const validCols = useDefaultCols ?
                [0, 1, 2, 3].filter(c => c <= maxCol) :
                selectedCols.filter(c => c <= maxCol).slice(0, 4);

            // 处理每行数据
            const dataPoints = [];
            jsonData.forEach((row, rowIndex) => {
                // 获取目标列数据
                let cols = validCols.map(c => {
                    const cell = row[c] || "";
                    return processCellValue(cell);
                });

                // 自动补零处理
                if (cols.length < 4) {
                    cols = [...cols, ...Array(4 - cols.length).fill('00')];
                }

                // 验证HEX有效性
                const invalidByte = cols.find(c => !/^[0-9A-F]{1,2}$/.test(c));
                if (invalidByte) {
                    console.warn(`第 ${rowIndex + 1} 行包含无效HEX值: ${invalidByte}`);
                    return;
                }

                // 处理字节序
                const bigEndian = document.getElementById('endianSelect').value === 'big';
                const orderedCols = bigEndian ? cols : cols.reverse();
                const hexString = orderedCols.join('');
                const decimalValue = parseInt(hexString, 16);

                dataPoints.push({
                    value: decimalValue,
                    raw: cols,
                    row: rowIndex + 1
                });
            });

            if (dataPoints.length === 0) throw new Error('没有有效数据');
            return dataPoints;
        }

        // 处理单元格值
        function processCellValue(cell) {
            if (typeof cell === 'number') {
                return Math.round(cell).toString(16).toUpperCase().padStart(2, '0');
            }
            return cell.toString().trim().toUpperCase().replace(/[^0-9A-F]/g, '');
        }

        // 图表渲染
        function renderChart(dataPoints) {
            const option = {
                title: {
                    text: 'Excel数据可视化',
                    subtext: [
                        `字节序：${document.getElementById('endianSelect').value === 'big' ? '大端' : '小端'}`,
                        `选择列：${document.getElementById('columns').value || '前4列'}`
                    ].join(' | '),
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis',
                    formatter: params => {
                        const d = dataPoints[params[0].dataIndex];
                        const hexValue = d.value.toString(16).toUpperCase().padStart(8, '0');
                        return [
                            `行号：${d.row}`,
                            `原始字节：${d.raw.join(' ')}`,
                            `HEX：0x${hexValue}`,
                            `十进制：${d.value.toLocaleString()}`
                        ].join('<br/>');
                    }
                },
                toolbox: {
                    feature: {

                        dataView: {
                            readOnly: true,
                            optionToContent: opt => {
                                const data = opt.series[0].data;
                                return '数据总数: ' + data.length + '\n' +
                                    '最大值: ' + Math.max(...data) + '\n' +
                                    '最小值: ' + Math.min(...data);
                            }
                        },
                        dataZoom: {
                            yAxisIndex: 'none'
                        },
                        saveAsImage: {},
                        restore: {}
                    }
                },
                xAxis: {
                    type: 'category',
                    name: '行号',
                    data: dataPoints.map(d => d.row),
                    axisLabel: { rotate: 45 }
                },
                yAxis: {
                    type: 'value',
                    name: '数值（十进制）',
                    // type: 'log',
                    // name: '数值（对数坐标）',
                    minorSplitLine: { show: true }
                },
                dataZoom: [{
                    type: 'slider',
                    start: 0,
                    end: 100,
                    fillerColor: 'rgba(33,150,243,0.2)'
                }],
                series: [{
                    name: '数据值',
                    type: 'line',
                    data: dataPoints.map(d => d.value),
                    smooth: true,
                    symbol: 'none',
                    lineStyle: {
                        width: 1.5,
                        color: '#2196F3'
                    },
                    markPoint: {
                        data: [
                            { type: 'max', name: '最大值' },
                            { type: 'min', name: '最小值' }
                        ]
                    }
                    //,
                    // areaStyle: {
                    //     color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    //         { offset: 0, color: 'rgba(33,150,243,0.8)' },
                    //         { offset: 1, color: 'rgba(33,150,243,0.1)' }
                    //     ])
                    // }
                }],
            };

            myChart.setOption(option);
            window.addEventListener('resize', myChart.resize);
        }
    </script>
</body>

</html>
