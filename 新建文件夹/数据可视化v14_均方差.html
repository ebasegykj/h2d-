<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>通用数据可视化by Rhycwu</title>
    <script src="./lib/echarts@560.min.js"></script>
    <script src="./lib/xlsx@0185.full.min.js"></script>
    <style>
        .control-panel {
            margin: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .type-selector {
            margin-bottom: 15px;
        }

        .file-input-group {
            display: none;
            margin-top: 6px;
        }

        .calculator-group {
            margin-top: 10px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 4px;
        }

        /* .file-input-group,
        .calculator-group {
            margin: 10px 0;
            padding: 8px;
            border-radius: 4px;
        } */

        .calculator-group input[type="text"] {
            width: 80px;
            padding: 4px;
        }

        .calculator-group button {
            padding: 4px 8px;
            margin-left: 5px;
        }

        .operator-select {
            width: 50px;
            padding: 4px;
        }

        button {
            padding: 5px 5px;
            margin-right: 10px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #1976D2;
        }

        label {
            margin-right: 15px;
        }

        select,
        input[type="text"] {
            padding: 5px;
            margin: 5px 0;
        }

        .chart-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chart-box {
            width: 1200px;
            height: 600px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="control-panel">
        <div class="type-selector">
            <button id="btnTxt">选择TXT文件</button>
            <button id="btnExcel">选择Excel文件</button>
            <button id="btnDiff">差分绘图</button>
            <button id="btnStd">滑动均方差</button>
        </div>

        <div class="file-input-group" id="txtGroup">
            <input type="file" id="txtInput" accept=".txt">
            <label>输入列索引(从0开始):
                <input type="text" id="txtColumns" placeholder="逗号分隔,留空默认前4列">
            </label>
            <label>字节序：
                <select id="endianTxt">
                    <option value="big">高位在前模式:如8'd1自动补零→[00,00,00,01]→0x00000001</option>
                    <option value="little">低位在前模式:如8'd1自动补零→[00,00,00,01]→0x01000000</option>
                </select>
            </label>
            <label>符号标志位：
                <input type="number" id="signBitTxt" placeholder="输入0~31,留空默认31">
            </label>
        </div>

        <div class="file-input-group" id="excelGroup">
            <input type="file" id="excelInput" accept=".xlsx,.xls">
            <label>输入列名:
                <input type="text" id="columns" placeholder="逗号分隔,留空默认前4列">
            </label>
            <label>字节序：
                <select id="endianExcel">
                    <option value="big">高位在前模式:如读取B列和E列数据→补零后[00,00,B列值,E列值]→0x0000BBEE</option>
                    <option value="little">低位在前模式:如读取B列和E列数据→补零后[00,00,B列值,E列值]→0xEEBB0000</option>
                </select>
            </label>

            <label>符号标志位：
                <input type="number" id="signBitExcel" placeholder="输入0~31,留空默认31">
            </label>


        </div>

        <div class="calculator-group">
            <label>数据计算器：
                <input type="text" id="inputA" placeholder="A值">
                <select id="operator" class="operator-select">
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">×</option>
                    <option value="/">÷</option>
                </select>
                <input type="text" id="inputB" placeholder="B值">
                =
                <output id="resultC">0</output>
            </label>
            <button id="btnSelectA">设为A</button>
            <button id="btnSelectB">设为B</button>

            <label class="calculator-group" style="margin-top: 15px;">
                <label>均方差滑动窗口大小:
                    <input type="number" id="windowSize" value="5" min="2" style="width: 60px;">
                </label>
            </label>

        </div>
    </div>



    <div class="chart-container">
        <div id="mainChart" class="chart-box"></div>
        <div id="diffChart" class="chart-box" style="display: none;"></div>
        <div id="stdChart" class="chart-box" style="display: none;"></div>
    </div>

    <script>
        // 应用状态管理
        const appState = {
            currentType: '',
            workbook: null,
            txtContent: null,
            mainData: [],
            diffData: [],
            stdData: [],
            zoomStates: { main: { start: 0, end: 100 }, diff: { start: 0, end: 100 }, std: { start: 0, end: 100 } },
            selection: { A: null, B: null, current: null }
        };

        currentChartType: 'main'
        // 图表实例
        const mainChart = echarts.init(document.getElementById('mainChart'));
        let diffChart = null;
        let stdChart = null;
        const BYTE_COUNT = 4;
        const DEFAULT_SIGN_BIT = 31;
        // 初始化事件监听器
        function bindInputs(ids, handler) {
            ids.forEach(id => document.getElementById(id).addEventListener('input', handler));
        }

        function bindClicks(ids, handler) {
            ids.forEach(id => document.getElementById(id).addEventListener('click', handler));
        }
        function initEventListeners() {
            // 文件类型切换（通过按钮ID动态生成类型参数）
            bindClicks(['btnTxt', 'btnExcel'], (e) => {
                const type = e.target.id.replace('btn', '').toLowerCase();
                showFileInput(type);
            });


            // 文件输入处理（change 事件单独处理）
            document.getElementById('txtInput').addEventListener('change', handleTxtFile);
            document.getElementById('excelInput').addEventListener('change', handleExcelFile);

            // 参数变更触发重载
            bindInputs(['columns', 'endianExcel', 'signBitExcel'], reloadData);
            bindInputs(['txtColumns', 'endianTxt', 'signBitTxt'], reloadData);

            // 图表功能按钮
            bindClicks(['btnDiff', 'btnStd'], (e) => {
                e.target.id === 'btnDiff' ? showDiffChart() : showStdChart();
            });

            // 计算器交互
            bindInputs(['operator', 'inputA', 'inputB'], calculate);
            bindClicks(['btnSelectA', 'btnSelectB'], handleSelection);

            // 滑动窗口监听
            bindInputs(['windowSize'], () => {
                if (appState.currentChartType === 'std') reloadStdData();
            });
        }

        // 文件类型切换
        function showFileInput(type) {
            appState.currentType = type;
            document.querySelectorAll('.file-input-group').forEach(el => el.style.display = 'none');
            document.getElementById(`${type}Group`).style.display = 'block';
            document.getElementById(`${type}Input`).value = '';
            appState.workbook = null;
            appState.txtContent = null;
            mainChart.clear();
        }

        // TXT文件处理
        function handleTxtFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = e => {
                appState.txtContent = e.target.result;
                reloadData();
            };
            reader.readAsText(file);
        }

        // Excel文件处理
        function handleExcelFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = e => {
                try {
                    appState.workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    reloadData();
                } catch (error) {
                    alert(`文件读取失败: ${error.message}`);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 重新加载数据
        function reloadData() {
            if (!appState.currentType) return;

            try {
                const data = appState.currentType === 'excel'
                    ? processExcelData()
                    : processTxtData(appState.txtContent);
                appState.mainData = data;
                renderMainChart();
            } catch (error) {
                alert(`数据处理失败: ${error.message}`);
            }
        }

        // 处理数据
        function processCommonData(selectedValues, byteCount, isBigEndian, signBit) {
            const bytes = processBytes(selectedValues, byteCount, isBigEndian);
            const value = parseInt(bytes.join(''), 16);
            return applySign(value, signBit);
        }
        function processExcelData() {
            const sheet = appState.workbook.Sheets[appState.workbook.SheetNames[0]];
            const rawData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

            const config = {
                columns: document.getElementById('columns').value
                    .split(',')
                    .map(c => columnToIndex(c.trim())),
                endian: document.getElementById('endianExcel').value === 'big',
                signBit: parseInt(document.getElementById('signBitExcel').value, 10) || DEFAULT_SIGN_BIT
            };

            return rawData.map(row => {
                const selected = (config.columns.length ? config.columns : [0, 1, 2, 3])
                    .map(c => processCellValue(row[c] || '00'));
                return processCommonData(selected, BYTE_COUNT, config.endian, config.signBit); // 调用通用函数
            });
        }

        // 重构后的 processTxtData
        function processTxtData(content) {
            const config = {
                columns: document.getElementById('txtColumns').value
                    .split(',')
                    .map(c => parseInt(c.trim())),
                endian: document.getElementById('endianTxt').value === 'big',
                signBit: parseInt(document.getElementById('signBitTxt').value, 10) || DEFAULT_SIGN_BIT
            };

            return content.trim().split('\n').map(line => {
                const rawCols = line.trim().split(/\s+/);
                const selected = (config.columns.length ? config.columns : [0, 1, 2, 3])
                    .map(c => (rawCols[c] || '00').padStart(2, '0'));
                return processCommonData(selected, BYTE_COUNT, config.endian, config.signBit); // 调用通用函数
            });
        }

        // 核心数据处理函数
        function processBytes(values, byteCount, isBigEndian) {
            const bytes = values.slice(0, byteCount);
            if (bytes.length < byteCount) {
                bytes.unshift(...Array(byteCount - bytes.length).fill('00'));
            }
            return isBigEndian ? bytes : bytes.reverse();
        }

        function applySign(value, signBit) {
            return (value >> signBit) & 1 ? -(2 ** (signBit + 1)) + value : value;
        }

        // 列名转换
        function columnToIndex(col) {
            return col.toUpperCase().split('').reduce((acc, c) => acc * 26 + (c.charCodeAt(0) - 64), 0) - 1;
        }

        // 单元格处理
        function processCellValue(cell) {
            return String(cell)
                .replace(/[^0-9A-Fa-f]/g, '')
                .padStart(2, '0')
                .toUpperCase()
                .slice(-2);
        }

        // 计算器功能
        function handleSelection(e) {
            appState.selection.current = e.target.id.replace('btnSelect', '');
            updateButtonState();
        }

        function calculate() {
            const a = parseFloat(document.getElementById('inputA').value) || 0;
            const b = parseFloat(document.getElementById('inputB').value) || 0;
            const op = document.getElementById('operator').value;

            let result;
            switch (op) {
                case '+': result = a + b; break;
                case '-': result = a - b; break;
                case '*': result = a * b; break;
                case '/': result = b !== 0 ? a / b : '∞';
            }

            document.getElementById('resultC').value =
                typeof result === 'number' ? result.toFixed(BYTE_COUNT) : result;
        }

        // 图表点击处理
        function initChartClick() {
            mainChart.off('click');
            mainChart.on('click', params => {
                if (appState.selection.current && params.value !== undefined) {
                    const value = parseFloat(params.value);
                    appState.selection[appState.selection.current] = {
                        value: value,
                        index: params.dataIndex
                    };
                    document.getElementById(`input${appState.selection.current}`).value = value.toFixed(BYTE_COUNT);
                    calculate();
                    highlightPoint(params.dataIndex);
                }
            });
        }

        function highlightPoint(index) {
            mainChart.dispatchAction({ type: 'downplay', seriesIndex: 0 });
            mainChart.dispatchAction({
                type: 'highlight',
                seriesIndex: 0,
                dataIndex: index
            });
        }

        function updateButtonState() {
            ['A', 'B'].forEach(btn => {
                const element = document.getElementById(`btnSelect${btn}`);
                element.style.backgroundColor = btn === appState.selection.current
                    ? '#4CAF50'
                    : '#2196F3';
            });
        }

        // 图表事件处理
        function initChartEvents(chartInstance, type) {
            chartInstance.off('datazoom');
            chartInstance.off('restore');

            chartInstance.on('datazoom', params => {
                const option = chartInstance.getOption();
                let start = 0, end = 100;
                option.dataZoom.forEach(dz => {
                    if (dz.start !== undefined) start = dz.start;
                    if (dz.end !== undefined) end = dz.end;
                });

                appState.zoomStates[type] = { start, end };

                if (type === 'main') {
                    updateChartInfo(appState.mainData, start, end, mainChart);
                    // 主图缩放时，需要重新生成差分和均方差数据
                    if (diffChart) {
                        showDiffChart();
                    }
                    if (stdChart) {
                        showStdChart();
                    }
                } else {
                    updateChartInfo(appState[`${type}Data`], start, end, chartInstance);
                }
            });

            // 处理restore事件
            chartInstance.on('restore', () => {
                appState.zoomStates[type] = { start: 0, end: 100 };
                updateChartInfo(appState[`${type}Data`], 0, 100, chartInstance);
            });
        }

        //实现标准差计算函数

        function calculateMovingVar(data, windowSize) {
            let sum = 0, squareSum = 0;
            const stdData = [];
            for (let i = 0; i < data.length; i++) {
                sum += data[i];
                squareSum += data[i] ** 2;
                if (i >= windowSize - 1) {
                    const mean = sum / windowSize;
                    const variance = (squareSum / windowSize) - (mean ** 2);
                    stdData.push(variance);
                    sum -= data[i - windowSize + 1];
                    squareSum -= data[i - windowSize + 1] ** 2;
                }
            }
            return stdData;
        }
        // 渲染主图表
        function renderMainChart() {
            const option = getChartOption(appState.mainData, 'main');
            mainChart.setOption(option, true);
            initChartClick();
            initChartEvents(mainChart, 'main');
            updateChartInfo(appState.mainData, 0, 100, mainChart);
        }

        // 显示差分图表
        function showDiffChart() {
            if (!appState.mainData.length) return;

            // 获取主图的缩放范围
            const { start, end } = appState.zoomStates.main;
            const startIndex = Math.floor(appState.mainData.length * start / 100);
            const endIndex = Math.ceil(appState.mainData.length * end / 100);
            const visibleMainData = appState.mainData.slice(startIndex, endIndex);

            // 生成差分数据
            appState.diffData = visibleMainData.slice(1).map((v, i) => v - visibleMainData[i]);

            const diffContainer = document.getElementById('diffChart');
            if (!diffChart) {
                diffChart = echarts.init(diffContainer);
                initChartEvents(diffChart, 'diff');
            }

            diffContainer.style.display = 'block';
            diffChart.setOption(getChartOption(appState.diffData, 'diff'), true);
            updateChartInfo(appState.diffData, 0, 100, diffChart);
        }

        function showStdChart() {
            if (!appState.mainData.length) return;

            // 获取主图的缩放范围
            const { start, end } = appState.zoomStates.main;
            const startIndex = Math.floor(appState.mainData.length * start / 100);
            const endIndex = Math.ceil(appState.mainData.length * end / 100);
            const visibleMainData = appState.mainData.slice(startIndex, endIndex);

            const windowSize = parseInt(document.getElementById('windowSize').value) || 5;
            if (windowSize < 2 || windowSize > visibleMainData.length) {
                // alert("窗口大小需在2到数据长度之间");
                return;
            }

            appState.stdData = calculateMovingVar(visibleMainData, windowSize);
            const container = document.getElementById('stdChart');

            if (!stdChart) {
                container.style.display = 'block';
                stdChart = echarts.init(container);
                initChartEvents(stdChart, 'std');
            }

            stdChart.setOption(getChartOption(appState.stdData, 'std'), true);
            updateChartInfo(appState.stdData, 0, 100, stdChart);
        }

        function reloadStdData() {
            if (appState.currentChartType === 'std') showStdChart();
        }
        // 更新图表信息
        function updateChartInfo(data, start, end, chart) {
            if (!data.length) return;

            const startIndex = Math.floor(data.length * start / 100);
            const endIndex = Math.ceil(data.length * end / 100);
            const visibleData = data.slice(startIndex, endIndex);

            chart.setOption({
                graphic: {
                    style: {
                        text: visibleData.length ? [
                            `数据范围: ${startIndex + 1}-${endIndex}`,
                            '─────────',
                            `最大值: ${Math.max(...visibleData).toFixed(BYTE_COUNT).padStart(11)}`,
                            `最小值: ${Math.min(...visibleData).toFixed(BYTE_COUNT).padStart(11)}`,
                            '─────────',
                            `差值 Δ: ${(Math.max(...visibleData) - Math.min(...visibleData)).toFixed(BYTE_COUNT).padStart(11)}`
                        ].join('\n') : '无数据'
                    }
                }
            });
        }

        // 获取图表配置
        function getChartOption(data, type = 'main') {
            const isMain = type === 'main';
            const isDiff = type === 'diff';
            const isStd = type === 'std';

            return {
                title: {
                    text: isMain ? '32位HEX数据可视化' : isDiff ? '差分数据可视化' : '滑动窗口均方差可视化',
                    subtext: isMain ? getSubtitle() : isDiff ? '后值减前值得出差值' : `窗口大小: ${document.getElementById('windowSize').value}`,
                    left: 'center'
                },
                xAxis: {
                    type: 'category',
                    name: isMain ? '行号' : isDiff ? '差值序号' : '均方差序号',
                    data: data.map((_, i) => isMain ? i + 1 : i + 2),
                    axisLabel: { rotate: 45 }
                },
                yAxis: {
                    type: 'value',
                    name: isMain ? '数值(十进制)' : isDiff ? '差值' : '均方差',
                },
                series: [{
                    type: 'line',
                    data,
                    large: true,
                    progressive: 500,     // 分片渲染阈值
                    animation: false,     // 关闭动画
                    smooth: false,
                    lineStyle: { width: 1.5, color: isMain ? '#2196F3' : isDiff ? '#FF9800' : '#4CAF50' }, symbol: 'circle',
                    symbolSize: 3,//'none',  // 关闭数据点
                    markPoint: isMain ? {
                        data: [
                            { type: 'max', name: '最大值', itemStyle: { color: 'red' } },
                            { type: 'min', name: '最小值', itemStyle: { color: 'green' } }
                        ]
                    } : null
                }],
                dataZoom: [{
                    type: 'slider',
                    start: appState.zoomStates[type].start,
                    end: appState.zoomStates[type].end,
                    fillerColor: `rgba(${isMain ? '33,150,243' : '255,152,0'},0.2)`,
                    realtime: true
                }, {
                    type: 'inside',
                    zoomOnMouseWheel: true
                }],
                tooltip: {
                    trigger: 'axis',
                    formatter: params => {
                        const { dataIndex, value } = params[0];
                        if (isMain) {
                            const hex = (value >>> 0).toString(16).toUpperCase().padStart(8, '0');
                            return `索引: ${dataIndex}<br/>十进制: ${value}<br/>HEX: 0x${hex}`;
                        } else if (isDiff) {
                            return `序号: ${dataIndex + 1}<br/>差值: ${value}`;
                        }
                        return `序号: ${dataIndex + 1}<br/>均方差: ${value}`;
                    }
                },
                toolbox: {
                    feature: {
                        saveAsImage: { title: '保存' },
                        dataZoom: { title: { zoom: '缩放', back: '还原' } },
                        restore: { title: '重置' }
                    },
                    itemSize: 16,
                    itemGap: 10,
                    right: 0,
                    top: 20
                },
                graphic: {
                    type: 'text',
                    right: 0,
                    top: 60,
                    style: {
                        text: '',
                        fill: '#666',
                        fontSize: 12,
                        lineHeight: 18
                    },
                    z: 100
                }
            };
        }

        function getSubtitle() {
            const isExcel = appState.currentType === 'excel';
            return [
                `字节序：${document.getElementById(isExcel ? 'endianExcel' : 'endianTxt').value === 'big' ? '高位' : '低位'}`,
                `符号标志位：${document.getElementById(isExcel ? 'signBitExcel' : 'signBitTxt').value || '31'}`,
                `选择列：${document.getElementById(isExcel ? 'columns' : 'txtColumns').value || '前4列'}`
            ].join(' | ');
        }

        // 初始化应用
        function init() {
            initEventListeners();
            initChartEvents(mainChart);
            initChartClick();
        }

        // 启动应用
        init();
    </script>
</body>

</html>
