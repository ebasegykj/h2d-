// ========== DSP 常量 ==========
const DSP = {
    LOWPASS: 0,
    HIGHPASS: 1,
    BANDPASS: 2,
    NOTCH: 3
};

// ========== Biquad 滤波器 ==========
class Biquad {
    constructor(type, cutoff, sampleRate, Q) {
        this.type = type;
        this.cutoff = cutoff;
        this.sampleRate = sampleRate;
        this.Q = Q || 1;

        // 计算通用系数
        const omega = 2 * Math.PI * cutoff / sampleRate;
        const alpha = Math.sin(omega) / (2 * this.Q);
        const cos_omega = Math.cos(omega);

        let b0, b1, b2, a0, a1, a2;

        switch (type) {
            case DSP.LOWPASS:
                b0 = (1 - cos_omega) / 2;
                b1 = 1 - cos_omega;
                b2 = (1 - cos_omega) / 2;
                a0 = 1 + alpha;
                a1 = -2 * cos_omega;
                a2 = 1 - alpha;
                break;
            case DSP.HIGHPASS:
                b0 = (1 + cos_omega) / 2;
                b1 = -(1 + cos_omega);
                b2 = (1 + cos_omega) / 2;
                a0 = 1 + alpha;
                a1 = -2 * cos_omega;
                a2 = 1 - alpha;
                break;
            case DSP.BANDPASS:
                b0 = alpha;
                b1 = 0;
                b2 = -alpha;
                a0 = 1 + alpha;
                a1 = -2 * cos_omega;
                a2 = 1 - alpha;
                break;
            case DSP.NOTCH:
                b0 = 1;
                b1 = -2 * cos_omega;
                b2 = 1;
                a0 = 1 + alpha;
                a1 = -2 * cos_omega;
                a2 = 1 - alpha;
                break;
            default:
                // 默认低通
                b0 = (1 - cos_omega) / 2;
                b1 = 1 - cos_omega;
                b2 = (1 - cos_omega) / 2;
                a0 = 1 + alpha;
                a1 = -2 * cos_omega;
                a2 = 1 - alpha;
        }

        // 归一化
        this.b0 = b0 / a0;
        this.b1 = b1 / a0;
        this.b2 = b2 / a0;
        this.a1 = a1 / a0;
        this.a2 = a2 / a0;

        // 状态变量
        this.x1 = 0; this.x2 = 0;
        this.y1 = 0; this.y2 = 0;
    }

    process(data) {
        // 标准Biquad Direct Form 1
        let out = [];
        let x1 = this.x1, x2 = this.x2;
        let y1 = this.y1, y2 = this.y2;
        for (let i = 0; i < data.length; i++) {
            let x0 = data[i];
            let y0 = this.b0 * x0 + this.b1 * x1 + this.b2 * x2
                - this.a1 * y1 - this.a2 * y2;
            out.push(y0);
            x2 = x1; x1 = x0;
            y2 = y1; y1 = y0;
        }
        // 可选：this.x1 = x1; this.x2 = x2; this.y1 = y1; this.y2 = y2;
        return out;
    }
}




function processBytes(values, byteCount, isBigEndian) {
    const bytes = values.slice(0, byteCount);
    if (bytes.length < byteCount) bytes.unshift(...Array(byteCount - bytes.length).fill('00'));
    return isBigEndian ? bytes : bytes.reverse();
}
function applySign(value, signBit) {
    return (value >> signBit) & 1 ? -(2 ** (signBit + 1)) + value : value;
}
    
function processCellValue(cell, isDecimal) {
    if (isDecimal) {
        // cell可能是带负号的字符串，直接parseFloat即可
        return parseFloat(cell);
    } else {
        return String(cell).replace(/[^0-9A-Fa-f]/g, '').padStart(2, '0').toUpperCase().slice(-2);
    }
}

// FFT（复制主线程实现并删去document等依赖）
class FFT {
    constructor(size) {
        this.size = size;
        this.cosTable = new Array(size);
        this.sinTable = new Array(size);
        for (let i = 0; i < size; i++) {
            const angle = -2 * Math.PI * i / size;
            this.cosTable[i] = Math.cos(angle);
            this.sinTable[i] = Math.sin(angle);
        }
    }
    static generateWindow(type, size) {
        const window = new Array(size);
        switch (type) {
            case 'hann':
                for (let i = 0; i < size; i++) {
                    window[i] = 0.5 * (1 - Math.cos(2 * Math.PI * i / (size - 1)));
                }
                break;
            case 'hamming':
                for (let i = 0; i < size; i++) {
                    window[i] = 0.54 - 0.46 * Math.cos(2 * Math.PI * i / (size - 1));
                }
                break;
            case 'blackman':
                for (let i = 0; i < size; i++) {
                    const a0 = 0.42;
                    const a1 = 0.5;
                    const a2 = 0.08;
                    window[i] = a0 - a1 * Math.cos(2 * Math.PI * i / (size - 1))
                        + a2 * Math.cos(4 * Math.PI * i / (size - 1));
                }
                break;
            case 'rect': default:
                for (let i = 0; i < size; i++) window[i] = 1;
        }
        return window;
    }
    transform(real, imag) {
        const n = real.length;
        for (let i = 0, j = 0; i < n; i++) {
            if (j > i) {
                [real[j], real[i]] = [real[i], real[j]];
                [imag[j], imag[i]] = [imag[i], imag[j]];
            }
            let m = n >> 1;
            while (m >= 1 && j >= m) {
                j -= m; m >>= 1;
            }
            j += m;
        }
        for (let s = 1; s < n; s <<= 1) {
            const m = s << 1, angleInc = n / m;
            for (let k = 0; k < s; k++) {
                const angle = k * angleInc;
                const wReal = this.cosTable[angle];
                const wImag = this.sinTable[angle];
                for (let i = k; i < n; i += m) {
                    const j = i + s;
                    const tempReal = wReal * real[j] - wImag * imag[j];
                    const tempImag = wReal * imag[j] + wImag * real[j];
                    real[j] = real[i] - tempReal; imag[j] = imag[i] - tempImag;
                    real[i] += tempReal; imag[i] += tempImag;
                }
            }
        }
    }
    static calculatePhase(real, imag) {
        return real.map((r, i) => Math.atan2(imag[i], r) * (180 / Math.PI));
    }
}

    none: (data) => data,
    diff: (data) => data.slice(1).map((v, i) => v - data[i]),
    movingAvg: (data, window) => {
        let sum = 0, result = [];
        for (let i = 0; i < data.length; i++) {
            sum += data[i];
            if (i >= window - 1) { result.push(sum / window); sum -= data[i - window + 1]; }
        }
        return result;
    },
    movingVar: (data, window) => {
        let sum = 0, squareSum = 0, result = [];
        for (let i = 0; i < data.length; i++) {
            sum += data[i]; squareSum += data[i] ** 2;
            if (i >= window - 1) {
                const mean = sum / window, variance = (squareSum / window) - (mean ** 2);
                result.push(variance); sum -= data[i - window + 1]; squareSum -= data[i - window + 1] ** 2;
            }
        }
        return result;
    },
    normalize: (data) => {
        const min = Math.min(...data), max = Math.max(...data), range = max - min;
        return range === 0 ? data.map(() => 0) : data.map(v => (v - min) / range);
    },
    cumsum: (data) => {let sum=0;return data.map(v => sum+=v);},
    abs: (data) => data.map(v => Math.abs(v)),
    fft: (data, params) => {
        // params: fftDisplayType, noiseFloor, windowType, appStatePadded
        const displayType = params.fftDisplayType;
        const windowType = params.windowType || 'hann';
        const noiseFloor = parseFloat(params.noiseFloor)|| -40;
        let len = data.length;
        const nextPowerOfTwo = (len & (len-1)) === 0 ? len : Math.pow(2, Math.ceil(Math.log2(len)));
        const paddedData = [...data];
        while (paddedData.length < nextPowerOfTwo) paddedData.push(0);
        params.paddedLength = paddedData.length; // 向主线程传递fft长度
        // 窗函数
        const window = FFT.generateWindow(windowType, paddedData.length);
        const windowedData = paddedData.map((v,i)=>v*window[i]);
        const fft = new FFT(paddedData.length);
        const real = windowedData.slice(), imag = new Array(windowedData.length).fill(0);
        fft.transform(real, imag);
        const magnitude = real.map((r,i)=>{
            const mag = Math.sqrt(r*r+imag[i]*imag[i]);
            let c = 1;
            if(windowType==='hann')c=0.5;if(windowType==='hamming')c=0.54;if(windowType==='blackman')c=0.42;
            return mag/(paddedData.length*c);
        });
        const phase=FFT.calculatePhase(real, imag);
        const validLength=Math.ceil(paddedData.length/2);
        const spectrum=magnitude.slice(0,validLength),phaseSpectrum=phase.slice(0,validLength);
        if(displayType==='magnitude')return spectrum;
        if(displayType==='phase')return phaseSpectrum;
        if(displayType==='snr'){
            const maxM = Math.max(...spectrum);
            return spectrum.map(mag=>mag<=0?noiseFloor:10*Math.log10(mag/maxM));
        }
        if(displayType==='trueSnr'){
            const sorted=[...spectrum].sort((a,b)=>b-a),signalPeaks=sorted.slice(0,Math.min(5,sorted.length));
            const avgSignalPower=signalPeaks.reduce((sum, v)=>sum+v*v,0)/signalPeaks.length;
            return spectrum.map((val,idx)=>{
                if(signalPeaks.includes(val))return 100;
                const start=Math.max(0,idx-5),end=Math.min(spectrum.length,idx+5);
                const noise=spectrum.slice(start,end).filter(v=>!signalPeaks.includes(v));
                const np=noise.reduce((sum,v)=>sum+v*v,0)/noise.length;
                return np===0?100:10*Math.log10(avgSignalPower/np);
            });
        }
        return spectrum;
    }
};

        // ========== 主页面逻辑 ==========

        function initEventListeners() {

        function showFileInput(type) {
            appState.currentType = type;

        function handleTxtFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                let content = e.target.result;
                const lines = content.trim().split('\n');
                const shouldReprocess = lines.length === 1 || lines.some(line => line.trim() === '');
                if (shouldReprocess) {
                    const userInput = prompt("检测到单行或存在空行数据，请输入每行的元素个数（大于1）:", "2");
                    const n = parseInt(userInput);
                    if (isNaN(n) || n < 2) { alert("输入无效，必须输入大于1的整数"); return; }
                    const allElements = lines.map(line => line.trim()).filter(line => line !== '').join(' ').split(/\s+/).filter(element => element !== '');
                    const chunked = []; for (let i = 0; i < allElements.length; i += n) {
                        const chunk = allElements.slice(i, i + n);
                        if (chunk.length === n) chunked.push(chunk.join(' '));
                    }
                    content = chunked.join('\n');
                    const blob = new Blob([content], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url;
                    const timestamp = new Date().toISOString().replace(/[-:.]/g, '').slice(0, 14);
                    a.download = `processed_${timestamp}.txt`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }
                appState.txtContent = content;
                reloadData();
            };
            reader.readAsText(file);
        }

        function handleExcelFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    appState.workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    reloadData();
                } catch (error) { alert(`文件读取失败: ${error.message}`); }
            };
            reader.readAsArrayBuffer(file);
        }

        function columnToIndex(col) {
            return col.toUpperCase().split('').reduce((acc, c) => acc * 26 + (c.charCodeAt(0) - 64), 0) - 1;
        }



        function reloadData() {
            if (!appState.currentType) return;
            try {
                let config, content, workbook;
                if (appState.currentType === 'excel') {
                    const sheet = appState.workbook.Sheets[appState.workbook.SheetNames[0]];
                    workbook = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
                    config = {
                        isDecimal: document.getElementById('dataFormatExcel').value === 'dec',
                        columns: document.getElementById('columns').value.split(',').map(c => {
                            let v = c.trim();
                            if (!v) return NaN;
                            return isNaN(Number(v)) ? columnToIndex(v) : parseInt(v);
                        }).filter(v => !isNaN(v)),
                        endian: document.getElementById('endianExcel').value === 'big',
                        signBit: parseInt(document.getElementById('signBitExcel').value, 10) || DEFAULT_SIGN_BIT,
                        coefficient: parseFloat(document.getElementById('coefficient').value) || 1

                } else {

                    config = {
                        isDecimal: document.getElementById('dataFormatTxt').value === 'dec',
                        columns: document.getElementById('txtColumns').value.split(',').map(c => parseInt(c.trim())).filter(v => !isNaN(v)),
                        endian: document.getElementById('endianTxt').value === 'big',
                        signBit: parseInt(document.getElementById('signBitTxt').value, 10) || DEFAULT_SIGN_BIT,
                        coefficient: parseFloat(document.getElementById('coefficient').value) || 1

                if (dataWorker) {

                            appState.mainData = ev.data.result;

                            if (appState.currentChartType === 'calc') showCalcChart();
                        } else {

                        }
                    };
                    dataWorker.postMessage({
                        action: "preprocess",
                        type: appState.currentType,
                        content, workbook, config, BYTE_COUNT, DEFAULT_SIGN_BIT

                } else {
                    alert('浏览器不支持Web Worker，可能处理大文件时卡顿');

            } catch (error) { alert(`数据处理失败: ${error.message}`); }

        function getChartOption(data, type = 'main') {
            const option = origGetChartOption(data, type);
            const isFFT = appState.currentOperation === 'fft' && appState.calcData.length > 16;
            if (isFFT) {
                const sampleRate = parseFloat(document.getElementById('sampleRate').value) || 1000;
                const N = appState.fftInfo.paddedLength || appState.calcData.length;
                const freqRes = sampleRate / N;
                let yArr = appState.calcData;
                let max = -Infinity, maxIdx = 0;
                for (let i = 0; i < yArr.length; i++)if (yArr[i] > max) max = yArr[i], maxIdx = i;
                let half = max / Math.sqrt(2), left = maxIdx, right = maxIdx;
                while (left > 0 && yArr[left] > half) left--;
                while (right < yArr.length - 1 && yArr[right] > half) right++;
                if (!option.series) option.series = [];
                if (!option.series[1]) option.series[1] = { type: 'line', data: [] };
                option.series[1].markPoint = {
                    data: [
                        { coord: [maxIdx, max], name: "主峰", value: `主峰 ${(maxIdx * freqRes).toFixed(2)}Hz`, itemStyle: { color: 'red' } }
                    ]
                };
                option.series[1].markLine = {
                    data: [
                        { xAxis: left, lineStyle: { type: 'dashed', color: '#ffa726' }, label: { formatter: '-3dB左' } },
                        { xAxis: right, lineStyle: { type: 'dashed', color: '#ffa726' }, label: { formatter: '-3dB右' } }
                    ]
                };
            }
            return option;
        }

        function updateChartInfo(data, start, end, chart) {
            if (!data.length) return;

            const startIndex = Math.floor(data.length * start / 100);
            const endIndex = Math.ceil(data.length * end / 100);
            const visibleData = data.slice(startIndex, endIndex);

            const calculateStats = (arr) => {
                let max = -Infinity;
                let min = Infinity;
                let sum = 0;
                let sumSq = 0;
                const batchSize = 10000;
                for (let i = 0; i < arr.length; i += batchSize) {
                    const batch = arr.slice(i, i + batchSize);
                    for (let j = 0; j < batch.length; j++) {
                        const val = batch[j];
                        max = Math.max(max, val);
                        min = Math.min(min, val);
                        sum += val;
                        sumSq += val * val;
                    }
                }
                const count = arr.length;
                const avg = sum / count;
                const variance = (sumSq / count) - (avg * avg);
                const stdDev = Math.sqrt(variance);
                const cv = (stdDev / avg * 100).toFixed(8);

                return { max, min, avg, cv, range: max - min };
            };

            const isFFTView = appState.currentOperation === 'fft';
            let infoText;

            if (isFFTView) {
                const sampleRate = parseFloat(document.getElementById('sampleRate').value) || 1000;
                const freqResolution = sampleRate / appState.fftInfo.paddedLength;
                const stats = calculateStats(visibleData);
                const maxFreqIndex = visibleData.indexOf(stats.max);
                const maxFreq = (maxFreqIndex * freqResolution).toFixed(2);

                const displayType = document.getElementById('fftDisplayType').value;
                const yAxisName = displayType === 'snr' ? '信噪比(dB)' :
                    displayType === 'phase' ? '相位(度)' : '幅度';

                const windowType = document.getElementById('windowType').value;
                const windowNames = {
                    'hann': '汉宁窗',
                    'hamming': '汉明窗',
                    'blackman': '布莱克曼窗',
                    'rect': '矩形窗'
                };

                infoText = [
                    `🪟 窗函数: ${windowNames[windowType]}`,
                    `🐉频率范围: ${(startIndex * freqResolution).toFixed(2)}-${(endIndex * freqResolution).toFixed(2)}Hz`,
                    '─────────',
                    `🐦最大值: ${stats.max.toFixed(4).padStart(11)} ${yAxisName}`,
                    displayType === 'phase' ? '' : `📡主频分量: ${maxFreq}Hz`,
                    '─────────',
                    `🔊平均值: ${stats.avg.toFixed(4).padStart(11)} ${yAxisName}`
                ].filter(line => line !== '').join('\n');
            } else {
                const stats = calculateStats(visibleData);
                infoText = [
                    `🐉数据范围: ${startIndex + 1}-${endIndex}`,
                    '─────────',
                    `🐦最大值: ${stats.max.toFixed(BYTE_COUNT).padStart(11)}`,
                    `🐛最小值: ${stats.min.toFixed(BYTE_COUNT).padStart(11)}`,
                    `📊平均值: ${stats.avg.toFixed(BYTE_COUNT).padStart(11)}`,
                    `📈变异系数: ${stats.cv}%`.padStart(14),
                    '─────────',
                    `🎯差值Δ: ${stats.range.toFixed(BYTE_COUNT).padStart(11)}`
                ].join('\n');
            }

            chart.setOption({
                graphic: {
                    style: {
                        text: visibleData.length ? infoText : '无数据',
                    }
                }
            });
        }
        function initChartEvents(chartInstance, type) {
            chartInstance.off('datazoom');
            chartInstance.off('restore');

            chartInstance.on('datazoom', params => {
                const option = chartInstance.getOption();
                let start = 0, end = 100;
                if (option.dataZoom && option.dataZoom.length) {
                    option.dataZoom.forEach(dz => {
                        if (dz.start !== undefined) start = dz.start;
                        if (dz.end !== undefined) end = dz.end;
                    });
                }
                appState.zoomStates[type] = { start, end };
                if (type === 'main') {
                    updateChartInfo(appState.mainData, start, end, mainChart);
                    if (appState.currentChartType === 'calc') showCalcChart();
                } else {
                    updateChartInfo(appState.calcData, start, end, mainChart);
                }
            });

            // === Restore：保证全局一致，还原区间和数据，并只显示当前的视图 ===
            chartInstance.on('restore', function () {
                appState.zoomStates[type] = { start: 0, end: 100 };

                // 只重置当前类型（main/calc），隐藏副图，主图视图同步
                if (type === 'main') {
                    appState.currentChartType = 'main';
                    appState.calcData = [];
                    document.getElementById('calcChart').style.display = 'none';
                    document.getElementById('mainChart').style.display = 'block';
                    mainChart.setOption(getChartOption(appState.mainData, 'main'), true);
                    updateChartInfo(appState.mainData, 0, 100, mainChart);
                } else if (type === 'calc') {
                    appState.currentChartType = 'calc';
                    document.getElementById('mainChart').style.display = 'block';
                    document.getElementById('calcChart').style.display = 'none';
                    // 你主副图本来就都在 mainChart 上渲染的，所以这里直接刷新
                    mainChart.setOption(getChartOption(appState.mainData, 'main'), true);
                    updateChartInfo(appState.mainData, 0, 100, mainChart);
                }
            });
        }
        function exportCurrentData() {
            try {
                const data = appState.currentChartType === 'main' ? appState.mainData : appState.calcData;
                if (!data.length) { alert('没有可导出的数据'); return; }
                const wsData = [
                    ['序号', '数值'],
                    ...data.map((value, index) => [index + 1, value])
                ];
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
                const timestamp = new Date().toISOString().replace(/[-:.]/g, '').slice(0, 14);
                const chartType = appState.currentChartType === 'main' ? '原始数据' : appState.currentOperation;
                const windowSize = appState.currentChartType === 'main' ? '' : `_窗口${appState.windowSize}`;
                XLSX.writeFile(wb, `数据导出_${chartType}${windowSize}_${timestamp}.xlsx`);
            } catch (error) {
                alert(`Excel导出失败: ${error.message}`); console.error(error);
            }
        }
        function getSubtitle() {
            const isExcel = appState.currentType === 'excel';
            return [
                `😊系数x：${document.getElementById('coefficient').value}`,
                `数据格式：${document.getElementById(isExcel ? 'dataFormatExcel' : 'dataFormatTxt').value === 'hex' ? '16进制' : '10进制'}`,
                `字节序：${document.getElementById(isExcel ? 'endianExcel' : 'endianTxt').value === 'big' ? '高位' : '低位'}`,
                `符号标志位：${document.getElementById(isExcel ? 'signBitExcel' : 'signBitTxt').value || '31'}`,
                `选择列：${document.getElementById(isExcel ? 'columns' : 'txtColumns').value || '前4列'}`
            ].join(' | ');
        }

        // ========== 启动 ==========
        function init() {
            initEventListeners();
            initChartEvents(mainChart, 'main');
        }
        init();

    </script>
</body>

</html>
