    <div class="chart-container">

        <div id="calcChart" class="chart-box" style="display: none;"></div>

    <script>
        // FFT实现
        class FFT {
            constructor(size) {
                this.size = size;
                this.cosTable = new Array(size);
                this.sinTable = new Array(size);

                for (let i = 0; i < size; i++) {
                    const angle = -2 * Math.PI * i / size;
                    this.cosTable[i] = Math.cos(angle);
                    this.sinTable[i] = Math.sin(angle);
                }
            }

            static generateWindow(type, size) {
                const window = new Array(size);
                switch (type) {
                    case 'hann':
                        for (let i = 0; i < size; i++) {
                            window[i] = 0.5 * (1 - Math.cos(2 * Math.PI * i / (size - 1)));
                        }
                        break;
                    case 'hamming':
                        for (let i = 0; i < size; i++) {
                            window[i] = 0.54 - 0.46 * Math.cos(2 * Math.PI * i / (size - 1));
                        }
                        break;
                    case 'blackman':
                        for (let i = 0; i < size; i++) {
                            const a0 = 0.42;
                            const a1 = 0.5;
                            const a2 = 0.08;
                            window[i] = a0 - a1 * Math.cos(2 * Math.PI * i / (size - 1))
                                + a2 * Math.cos(4 * Math.PI * i / (size - 1));
                        }
                        break;
                    case 'rect':
                    default:
                        for (let i = 0; i < size; i++) {
                            window[i] = 1;
                        }
                }
                return window;
            }




            transform(real, imag) {
                const n = real.length;

                // 位反转置换 - 使用迭代实现
                for (let i = 0, j = 0; i < n; i++) {
                    if (j > i) {
                        [real[j], real[i]] = [real[i], real[j]];
                        [imag[j], imag[i]] = [imag[i], imag[j]];
                    }

                    let m = n >> 1;
                    while (m >= 1 && j >= m) {
                        j -= m;
                        m >>= 1;
                    }
                    j += m;
                }

                // 蝶形运算 - 使用迭代实现
                for (let s = 1; s < n; s <<= 1) {
                    const m = s << 1;
                    const angleInc = n / m;

                    for (let k = 0; k < s; k++) {
                        const angle = k * angleInc;
                        const wReal = this.cosTable[angle];
                        const wImag = this.sinTable[angle];

                        for (let i = k; i < n; i += m) {
                            const j = i + s;
                            const tempReal = wReal * real[j] - wImag * imag[j];
                            const tempImag = wReal * imag[j] + wImag * real[j];

                            real[j] = real[i] - tempReal;
                            imag[j] = imag[i] - tempImag;
                            real[i] += tempReal;
                            imag[i] += tempImag;
                        }
                    }
                }
            }
            // 新增：计算相位谱
            static calculatePhase(real, imag) {
                return real.map((r, i) => {
                    // 计算相位（弧度）
                    let phase = Math.atan2(imag[i], r);
                    // 转换为角度
                    return phase * (180 / Math.PI);
                });
            }
        }

        // 应用状态管理
        const appState = {
            currentType: '',
            workbook: null,
            txtContent: null,
            mainData: [],
            calcData: [],
            zoomStates: { main: { start: 0, end: 100 }, calc: { start: 0, end: 100 } },
            selection: { A: null, B: null, current: null },
            coefficient: 1,
            currentChartType: 'main',
            currentOperation: '',
            windowSize: 5,
            fftInfo: { paddedLength: 0 } // 新增FFT信息存储
        };

        // 预定义数据处理方法
        const dataOperations = {
            none: (data) => data,
            diff: (data) => data.slice(1).map((v, i) => v - data[i]),
            movingAvg: (data, window) => {
                let sum = 0;
                const result = [];
                for (let i = 0; i < data.length; i++) {
                    sum += data[i];
                    if (i >= window - 1) {
                        result.push(sum / window);
                        sum -= data[i - window + 1];
                    }
                }
                return result;
            },
            movingVar: (data, window) => {
                let sum = 0, squareSum = 0;
                const result = [];
                for (let i = 0; i < data.length; i++) {
                    sum += data[i];
                    squareSum += data[i] ** 2;
                    if (i >= window - 1) {
                        const mean = sum / window;
                        const variance = (squareSum / window) - (mean ** 2);
                        result.push(variance);
                        sum -= data[i - window + 1];
                        squareSum -= data[i - window + 1] ** 2;
                    }
                }
                return result;
            },
            normalize: (data) => {
                const min = Math.min(...data);
                const max = Math.max(...data);
                const range = max - min;
                return range === 0 ? data.map(() => 0) : data.map(v => (v - min) / range);
            },
            cumsum: (data) => {
                let sum = 0;
                return data.map(v => sum += v);
            },
            abs: (data) => data.map(v => Math.abs(v)),


            fft: (data) => {
                // 补零到2的幂次方
                const nextPowerOfTwo = data.length & (data.length - 1) === 0
                    ? data.length
                    : Math.pow(2, Math.ceil(Math.log2(data.length)));
                const paddedData = [...data];
                while (paddedData.length < nextPowerOfTwo) {
                    paddedData.push(0);
                }

                // 记录补零后的长度到状态管理
                appState.fftInfo.paddedLength = paddedData.length;

                // 获取窗函数类型
                const windowType = document.getElementById('windowType').value || 'hann';

                // 应用窗函数
                const window = FFT.generateWindow(windowType, paddedData.length);
                const windowedData = paddedData.map((v, i) => v * window[i]);

                // 初始化FFT
                const fft = new FFT(paddedData.length);
                const real = windowedData.slice();
                const imag = new Array(windowedData.length).fill(0);

                // 执行FFT
                fft.transform(real, imag);

                // 根据显示类型返回不同数据
                const displayType = document.getElementById('fftDisplayType').value;
                const noiseFloor = parseFloat(document.getElementById('noiseFloor').value) || -40;

                // 计算幅度谱和相位谱
                const magnitude = real.map((r, i) => {
                    const mag = Math.sqrt(r * r + imag[i] * imag[i]);
                    // 根据窗函数类型进行补偿
                    let compensationFactor = 1;
                    if (windowType === 'hann') compensationFactor = 0.5;
                    if (windowType === 'hamming') compensationFactor = 0.54;
                    if (windowType === 'blackman') compensationFactor = 0.42;
                    return mag / (appState.fftInfo.paddedLength * compensationFactor);
                });

                const phase = FFT.calculatePhase(real, imag);

                // 只返回前半部分（对称性）
                const validLength = Math.ceil(paddedData.length / 2);
                const spectrum = magnitude.slice(0, validLength);
                const phaseSpectrum = phase.slice(0, validLength);

                if (displayType === 'magnitude') {
                    return spectrum;
                } else if (displayType === 'phase') {
                    return phaseSpectrum;
                } else if (displayType === 'snr') {
                    // 计算信噪比(SNR)
                    const maxMagnitude = Math.max(...spectrum);
                    return spectrum.map(mag => {
                        return mag <= 0 ? noiseFloor : 10 * Math.log10(mag / maxMagnitude);
                    });
                }
                // 计算真实SNR
                if (displayType === 'trueSnr') {
                    // 计算信号功率(取前5个最大峰值的平均)
                    const sorted = [...spectrum].sort((a, b) => b - a);
                    const signalPeaks = sorted.slice(0, Math.min(5, sorted.length));
                    const avgSignalPower = signalPeaks.reduce((sum, val) => sum + val * val, 0) / signalPeaks.length;

                    // 计算每个频率点的噪声功率(排除前5个峰值)
                    return spectrum.map((val, idx) => {
                        if (signalPeaks.includes(val)) return 100; // 信号点设为最大值

                        // 计算局部噪声功率(周围10个点)
                        const start = Math.max(0, idx - 5);
                        const end = Math.min(spectrum.length, idx + 5);
                        const noiseValues = spectrum.slice(start, end).filter(v => !signalPeaks.includes(v));
                        const noisePower = noiseValues.reduce((sum, v) => sum + v * v, 0) / noiseValues.length;

                        return noisePower === 0 ? 100 : // 无噪声时设为最大值
                            10 * Math.log10(avgSignalPower / noisePower);
                    });
                }

                return spectrum;
            }
        };

        // 图表实例
        const mainChart = echarts.init(document.getElementById('mainChart'));
        let calcChart = null;
        const BYTE_COUNT = 4;
        const DEFAULT_SIGN_BIT = 31;

        // 初始化事件监听器
        function bindInputs(ids, handler) {
            ids.forEach(id => document.getElementById(id).addEventListener('input', handler));
        }

        function bindClicks(ids, handler) {
            ids.forEach(id => document.getElementById(id).addEventListener('click', handler));
        }

        function initEventListeners() {
            // 文件类型切换
            bindClicks(['btnTxt', 'btnExcel'], (e) => {
                const type = e.target.id.replace('btn', '').toLowerCase();
                showFileInput(type);
                showMainChart();
            });

            // 文件输入处理
            document.getElementById('txtInput').addEventListener('change', handleTxtFile);
            document.getElementById('excelInput').addEventListener('change', handleExcelFile);

            // 参数变更触发重载
            bindInputs(['columns', 'endianExcel', 'signBitExcel'], reloadData);
            bindInputs(['txtColumns', 'endianTxt', 'signBitTxt'], reloadData);
            bindInputs(['dataFormatTxt', 'dataFormatExcel'], reloadData);

            // 图表功能按钮
            bindClicks(['btnMain', 'btnExport'], (e) => {
                switch (e.target.id) {
                    case 'btnMain': showMainChart(); break;
                    case 'btnExport': exportCurrentData(); break;
                }
            });

            // 数据处理操作应用按钮
            document.getElementById('btnApplyOperation').addEventListener('click', showCalcChart);

            // 滑动窗口监听
            bindInputs(['windowSize'], () => {
                appState.windowSize = parseInt(document.getElementById('windowSize').value) || 5;
                if (appState.currentChartType === 'calc') showCalcChart();
            });

            bindInputs(['coefficient'], reloadData);

            document.getElementById('dataOperation').addEventListener('change', function () {
                const isFFT = this.value === 'fft';
                document.getElementById('sampleRateLabel').style.display = isFFT ? 'inline-block' : 'none';
                document.getElementById('fftDisplayLabel').style.display = isFFT ? 'inline-block' : 'none';
                document.getElementById('noiseFloorLabel').style.display = isFFT ? 'inline-block' : 'none';
            });

            // FFT显示类型变化时重新计算
            document.getElementById('fftDisplayType').addEventListener('change', function () {
                if (appState.currentOperation === 'fft') {
                    showCalcChart();
                }
            });

            // 噪声基底变化时重新计算
            document.getElementById('noiseFloor').addEventListener('change', function () {
                if (appState.currentOperation === 'fft') {
                    showCalcChart();
                }
            });
            // 窗口类型变化时重新计算
            document.getElementById('dataOperation').addEventListener('change', function () {
                const isFFT = this.value === 'fft';
                const needsWindow = ['movingAvg', 'movingVar'].includes(this.value);
                document.getElementById('windowSizeLabel').style.display = needsWindow ? 'inline-block' : 'none';

                document.getElementById('sampleRateLabel').style.display = isFFT ? 'inline-block' : 'none';
                document.getElementById('fftDisplayLabel').style.display = isFFT ? 'inline-block' : 'none';
                document.getElementById('noiseFloorLabel').style.display = isFFT ? 'inline-block' : 'none';
                document.getElementById('windowTypeLabel').style.display = isFFT ? 'inline-block' : 'none';
            });
        }

        // 导出当前数据为Excel
        function exportCurrentData() {
            try {
                const data = appState.currentChartType === 'main' ? appState.mainData : appState.calcData;
                if (!data.length) {
                    alert('没有可导出的数据');
                    return;
                }

                // 准备Excel数据
                const wsData = [
                    ['序号', '数值'],
                    ...data.map((value, index) => [index + 1, value])
                ];

                const ws = XLSX.utils.aoa_to_sheet(wsData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Sheet1");

                // 生成Excel文件
                const timestamp = new Date().toISOString().replace(/[-:.]/g, '').slice(0, 14);
                const chartType = appState.currentChartType === 'main' ? '原始数据' : appState.currentOperation;
                const windowSize = appState.currentChartType === 'main' ? '' : `_窗口${appState.windowSize}`;
                XLSX.writeFile(wb, `数据导出_${chartType}${windowSize}_${timestamp}.xlsx`);

            } catch (error) {
                alert(`Excel导出失败: ${error.message}`);
                console.error(error);
            }
        }

        // 显示主图表
        function showMainChart() {
            appState.currentChartType = 'main';
            appState.currentOperation = ''; // 重置当前操作状态
            appState.calcData = []; // 清空处理后的数据

            // 隐藏计算图表，显示主图表
            document.getElementById('calcChart').style.display = 'none';
            document.getElementById('mainChart').style.display = 'block';

            // 重置缩放状态
            appState.zoomStates.main = { start: 0, end: 100 };

            // 更新主图表，只显示原始数据
            mainChart.setOption(getChartOption(appState.mainData, 'main'), true);
            updateChartInfo(appState.mainData, appState.zoomStates.main.start, appState.zoomStates.main.end, mainChart);

            // 调整图表大小
            setTimeout(() => mainChart.resize(), 0);
        }

        // 显示计算图表
        function showCalcChart() {
            if (!appState.mainData.length) return;

            appState.currentChartType = 'calc';

            const { start, end } = appState.zoomStates.main;
            const startIndex = Math.floor(appState.mainData.length * start / 100);
            const endIndex = Math.ceil(appState.mainData.length * end / 100);
            const visibleMainData = appState.mainData.slice(startIndex, endIndex);

            try {
                const windowSize = parseInt(document.getElementById('windowSize').value) || 5;
                appState.windowSize = windowSize;

                const operation = document.getElementById('dataOperation').value;
                appState.currentOperation = operation;

                const operationFn = dataOperations[operation] || dataOperations.none;
                appState.calcData = operationFn(visibleMainData, windowSize);

                // 更新主图表，同时显示原始数据和处理后数据
                mainChart.setOption(getChartOption(visibleMainData, 'calc'), true);
                updateChartInfo(visibleMainData, start, end, mainChart);

            } catch (error) {
                alert(`数据处理错误: ${error.message}`);
                console.error(error);
            }
        }


        // 文件类型切换
        function showFileInput(type) {
            appState.currentType = type;
            document.querySelectorAll('.file-input-group').forEach(el => el.style.display = 'none');
            document.getElementById(`${type}Group`).style.display = 'block';
            document.getElementById(`${type}Input`).value = '';
            appState.workbook = null;
            appState.txtContent = null;
            mainChart.clear();
        }

        // TXT文件处理
        function handleTxtFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = e => {
                let content = e.target.result;
                const lines = content.trim().split('\n');

                // 检查是否需要重新分块处理
                const shouldReprocess = lines.length === 1 || lines.some(line => line.trim() === '');

                if (shouldReprocess) {
                    const userInput = prompt("检测到单行或存在空行数据，请输入每行的元素个数（大于1）:", "2");
                    const n = parseInt(userInput);

                    if (isNaN(n) || n < 2) {
                        alert("输入无效，必须输入大于1的整数");
                        return;
                    }

                    // 合并所有非空行的内容
                    const allElements = lines
                        .map(line => line.trim())
                        .filter(line => line !== '')
                        .join(' ')
                        .split(/\s+/)
                        .filter(element => element !== '');

                    // 重新分块 - 只保留完整的行
                    const chunked = [];
                    for (let i = 0; i < allElements.length; i += n) {
                        const chunk = allElements.slice(i, i + n);
                        // 只有当chunk长度等于n时才保留
                        if (chunk.length === n) {
                            chunked.push(chunk.join(' '));
                        }
                    }
                    content = chunked.join('\n');

                    // 可选: 自动下载处理后的文件
                    const blob = new Blob([content], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const timestamp = new Date().toISOString().replace(/[-:.]/g, '').slice(0, 14);
                    a.download = `processed_${timestamp}.txt`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }

                appState.txtContent = content;
                reloadData();
            };
            reader.readAsText(file);
        }

        // Excel文件处理
        function handleExcelFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = e => {
                try {
                    appState.workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    reloadData();
                } catch (error) {
                    alert(`文件读取失败: ${error.message}`);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 重新加载数据
        function reloadData() {
            if (!appState.currentType) return;

            try {
                const data = appState.currentType === 'excel'
                    ? processExcelData()
                    : processTxtData(appState.txtContent);
                appState.mainData = data;
                renderMainChart();

                if (appState.currentChartType === 'calc') {
                    showCalcChart();
                }
            } catch (error) {
                alert(`数据处理失败: ${error.message}`);
            }
        }

        // 处理数据
        function processCommonData(selectedValues, byteCount, isBigEndian, signBit, isDecimal) {
            if (isDecimal) {
                // 处理10进制数据
                const decimalStr = selectedValues.join('').replace(/[^0-9-]/g, '');
                const rawValue = parseFloat(decimalStr);
                const coefficient = parseFloat(document.getElementById('coefficient').value) || 1;
                return rawValue * coefficient;
            } else {
                // 原有16进制处理逻辑保持不变
                const bytes = processBytes(selectedValues, byteCount, isBigEndian);
                const value = parseInt(bytes.join(''), 16);
                const rawValue = applySign(value, signBit);
                const coefficient = parseFloat(document.getElementById('coefficient').value) || 1;
                return rawValue * coefficient;
            }
        }

        function processExcelData() {
            const sheet = appState.workbook.Sheets[appState.workbook.SheetNames[0]];
            const rawData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

            const config = {
                isDecimal: document.getElementById('dataFormatExcel').value === 'dec',
                columns: document.getElementById('columns').value
                    .split(',')
                    .map(c => columnToIndex(c.trim())),
                endian: document.getElementById('endianExcel').value === 'big',
                signBit: parseInt(document.getElementById('signBitExcel').value, 10) || DEFAULT_SIGN_BIT
            };

            return rawData.map(row => {
                const selected = (config.columns.length ? config.columns : [0, 1, 2, 3])
                    .map(c => processCellValue(row[c] || '00', config.isDecimal));
                return processCommonData(selected, BYTE_COUNT, config.endian, config.signBit, config.isDecimal);
            });
        }

        function processTxtData(content) {
            const config = {
                isDecimal: document.getElementById('dataFormatTxt').value === 'dec',
                columns: document.getElementById('txtColumns').value
                    .split(',')
                    .map(c => parseInt(c.trim())),
                endian: document.getElementById('endianTxt').value === 'big',
                signBit: parseInt(document.getElementById('signBitTxt').value, 10) || DEFAULT_SIGN_BIT
            };

            return content.trim().split('\n').map(line => {
                const rawCols = line.trim().split(/\s+/);
                const selected = (config.columns.length ? config.columns : [0, 1, 2, 3])
                    .map(c => processCellValue((rawCols[c] || '00'), config.isDecimal));
                return processCommonData(selected, BYTE_COUNT, config.endian, config.signBit, config.isDecimal);
            });
        }

        // 核心数据处理函数
        function processBytes(values, byteCount, isBigEndian) {
            const bytes = values.slice(0, byteCount);
            if (bytes.length < byteCount) {
                bytes.unshift(...Array(byteCount - bytes.length).fill('00'));
            }
            return isBigEndian ? bytes : bytes.reverse();
        }

        function applySign(value, signBit) {
            return (value >> signBit) & 1 ? -(2 ** (signBit + 1)) + value : value;
        }

        // 列名转换
        function columnToIndex(col) {
            return col.toUpperCase().split('').reduce((acc, c) => acc * 26 + (c.charCodeAt(0) - 64), 0) - 1;
        }

        // 单元格处理
        function processCellValue(cell, isDecimal) {
            if (isDecimal) {
                // 处理10进制数据 - 只保留数字和负号
                return String(cell).replace(/[^0-9-]/g, '');
            } else {
                // 原有16进制处理逻辑保持不变
                return String(cell)
                    .replace(/[^0-9A-Fa-f]/g, '')
                    .padStart(2, '0')
                    .toUpperCase()
                    .slice(-2);
            }
        }
        

        // 图表点击处理
        function initChartClick() {
            mainChart.off('click');
            mainChart.on('click', params => {
                if (appState.selection.current && params.value !== undefined) {
                    const value = parseFloat(params.value);
                    appState.selection[appState.selection.current] = {
                        value: value,
                        index: params.dataIndex
                    };
                    document.getElementById(`input${appState.selection.current}`).value = value.toFixed(BYTE_COUNT);
                    calculate();
                    highlightPoint(params.dataIndex);
                }
            });
        }

        function highlightPoint(index) {
            mainChart.dispatchAction({ type: 'downplay', seriesIndex: 0 });
            mainChart.dispatchAction({
                type: 'highlight',
                seriesIndex: 0,
                dataIndex: index
            });
        }

        // 图表事件处理
        function initChartEvents(chartInstance, type) {
            chartInstance.off('datazoom');
            chartInstance.off('restore');

            chartInstance.on('datazoom', params => {
                const option = chartInstance.getOption();
                let start = 0, end = 100;

                if (option.dataZoom && option.dataZoom.length) {
                    option.dataZoom.forEach(dz => {
                        if (dz.start !== undefined) start = dz.start;
                        if (dz.end !== undefined) end = dz.end;
                    });
                }

                appState.zoomStates[type] = { start, end };

                if (type === 'main') {
                    updateChartInfo(appState.mainData, start, end, mainChart);
                    if (calcChart && appState.currentChartType === 'calc') {
                        showCalcChart();
                    }
                } else {
                    updateChartInfo(appState.calcData, start, end, chartInstance);
                }
            });


            chartInstance.on('restore', () => {
                // 重置状态管理中的缩放参数
                appState.zoomStates[type] = { start: 0, end: 100 };

                // 强制将dataZoom设置为全范围
                chartInstance.dispatchAction({
                    type: 'dataZoom',
                    start: 0,
                    end: 100
                });

                // 更新图表信息
                updateChartInfo(appState[`${type}Data`], 0, 100, chartInstance);

                // 如果是主图表，同步重置计算图表
                if (type === 'main' && calcChart) {
                    calcChart.dispatchAction({
                        type: 'dataZoom',
                        start: 0,
                        end: 100
                    });
                }
            });
        }

        // 渲染主图表
        function renderMainChart() {
            const option = getChartOption(appState.mainData, 'main');
            mainChart.setOption(option, true);
            initChartClick();
            initChartEvents(mainChart, 'main');
            updateChartInfo(appState.mainData, 0, 100, mainChart);
        }

        // 更新图表信息显示
        function updateChartInfo(data, start, end, chart) {
            if (!data.length) return;

            const startIndex = Math.floor(data.length * start / 100);
            const endIndex = Math.ceil(data.length * end / 100);
            const visibleData = data.slice(startIndex, endIndex);

            let infoText;

            // 修改判断条件，同时检查 currentChartType 和 currentOperation
            const isFFTView = appState.currentOperation === 'fft';

            if (isFFTView) {
                const sampleRate = parseFloat(document.getElementById('sampleRate').value) || 1000;
                const freqResolution = sampleRate / appState.fftInfo.paddedLength;
                const maxFreqIndex = visibleData.indexOf(Math.max(...visibleData));
                const maxFreq = (maxFreqIndex * freqResolution).toFixed(2);

                const displayType = document.getElementById('fftDisplayType').value;
                const yAxisName = displayType === 'snr' ? '信噪比(dB)' :
                    displayType === 'phase' ? '相位(度)' : '幅度';

                const windowType = document.getElementById('windowType').value;
                const windowNames = {
                    'hann': '汉宁窗',
                    'hamming': '汉明窗',
                    'blackman': '布莱克曼窗',
                    'rect': '矩形窗'
                };

                infoText = [
                    `🪟 窗函数: ${windowNames[windowType]}`,
                    `🐉频率范围: ${(startIndex * freqResolution).toFixed(2)}-${(endIndex * freqResolution).toFixed(2)}Hz`,
                    '─────────',
                    `🐦最大值: ${Math.max(...visibleData).toFixed(4).padStart(11)} ${yAxisName}`,
                    displayType === 'phase' ? '' : `📡主频分量: ${maxFreq}Hz`,
                    '─────────',
                    `🔊平均值: ${(visibleData.reduce((a, b) => a + b, 0) / visibleData.length).toFixed(4).padStart(11)} ${yAxisName}`
                ].filter(line => line !== '').join('\n');
            } else {
                // 计算新增指标
            const avg = visibleData.reduce((a, b) => a + b, 0) / visibleData.length;
            const squaredDiff = visibleData.reduce((a, b) => a + Math.pow(b - avg, 2), 0);
            const stdDev = Math.sqrt(squaredDiff / visibleData.length);
            const cv = (stdDev / avg * 100).toFixed(2); // 变异系数(%)
                // 常规数据的信息

                infoText = [
                `🐉数据范围: ${startIndex + 1}-${endIndex}`,
                '─────────',
                `🐦最大值: ${Math.max(...visibleData).toFixed(BYTE_COUNT).padStart(11)}`,
                `🐛最小值: ${Math.min(...visibleData).toFixed(BYTE_COUNT).padStart(11)}`,
                // 新增均值显示
                `📊平均值: ${avg.toFixed(BYTE_COUNT).padStart(11)}`,
                // 新增数据一致性指标(变异系数)
                `📈变异系数: ${cv}%`.padStart(14),
                '─────────',
                `🎯差值Δ: ${(Math.max(...visibleData) - Math.min(...visibleData)).toFixed(BYTE_COUNT).padStart(11)}`
                ].join('\n');
            }

            chart.setOption({
                graphic: {
                    style: {
                        text: visibleData.length ? infoText : '无数据',
                    }
                }
            });
        }

        // 更新图表配置函数
        function getChartOption(data, type = 'main') {
            const isMain = type === 'main';
            const isCalc = type === 'calc';
            const isFFT = appState.currentOperation === 'fft';

            // 准备x轴数据
            let xAxisData;
            if (isFFT) {
                const sampleRate = parseFloat(document.getElementById('sampleRate').value) || 1000;
                const freqResolution = sampleRate / appState.fftInfo.paddedLength;
                xAxisData = data.map((_, i) => (i * freqResolution).toFixed(2) + 'Hz');
            } else {
                xAxisData = data.map((_, i) => i + 1);
            }

            // 确定Y轴名称
            let yAxisName;
            if (isFFT) {
                const displayType = document.getElementById('fftDisplayType').value;
                yAxisName = displayType === 'snr' ? '📶信噪比(dB)' :
                    displayType === 'phase' ? '📐相位(度)' :
                        displayType === 'trueSnr' ? '🎚️真实SNR(dB)' : '📈幅度';
            } else {
                yAxisName = isMain ? '🧸数值(十进制)' : '🐎计算结果';
            }

            // 准备系列数据
            const series = [{
                type: 'line',
                name: '原始数据',
                data: data,
                large: true,
                progressive: 500,
                animation: false,
                smooth: false,
                lineStyle: { width: 1.5, color: '#2196F3' }, // 蓝色
                symbol: 'circle',
                symbolSize: 3,
                markPoint: {
                    data: [
                        { type: 'max', name: '最大值', itemStyle: { color: 'red' } },
                        { type: 'min', name: '最小值', itemStyle: { color: 'green' } }
                    ]
                }
            }];

            // 如果是计算图表，添加处理后数据系列
            if (isCalc && appState.calcData.length > 0) {
                series.push({
                    type: 'line',
                    name: '处理后数据',
                    data: appState.calcData,
                    large: true,
                    progressive: 500,
                    animation: false,
                    smooth: false,
                    lineStyle: { width: 1.5, color: '#F44336' }, // 红色
                    symbol: 'circle',
                    symbolSize: 3
                });
            }

            return {
                title: {
                    text: isMain ? '🪬32位HEX数据可视化' :
                        isFFT ? '📊 傅里叶变换结果' : '💻 数据处理结果',
                    subtext: isMain ? getSubtitle() :
                        isFFT ? `频域分析 | 显示: ${yAxisName}` : `操作: ${appState.currentOperation} | 窗口大小: ${appState.windowSize}`,
                    left: 'center'
                },
                xAxis: {
                    type: 'category',
                    name: isMain ? '🎰行号' :
                        isFFT ? '📡频率(Hz)' : '🔢计算序号',
                    data: xAxisData,
                    axisLabel: { rotate: 45 }
                },
                yAxis: {
                    type: 'value',
                    name: yAxisName,
                },
                series: series,
                dataZoom: [{
                    type: 'slider',
                    start: appState.zoomStates[type].start,
                    end: appState.zoomStates[type].end,
                    fillerColor: `rgba(${isMain ? '33,150,243' : '76,175,80'},0.2)`,
                    realtime: true
                }, {
                    type: 'inside',
                    zoomOnMouseWheel: true
                }],
                tooltip: {
                    trigger: 'axis',
                    formatter: params => {
                        let result = [];
                        params.forEach(param => {
                            const { seriesName, dataIndex, value } = param;
                            if (isFFT) {
                                const sampleRate = parseFloat(document.getElementById('sampleRate').value) || 1000;
                                const freqResolution = sampleRate / appState.fftInfo.paddedLength;
                                const freq = (dataIndex * freqResolution).toFixed(2);

                                const displayType = document.getElementById('fftDisplayType').value;
                                if (displayType === 'phase') {
                                    result.push(`${seriesName}<br/>频率: ${freq}Hz<br/>相位: ${value}°`);
                                } else if (displayType === 'snr' || displayType === 'trueSnr') {
                                    result.push(`${seriesName}<br/>频率: ${freq}Hz<br/>相对幅度: ${value}dB`);
                                } else {
                                    result.push(`${seriesName}<br/>频率: ${freq}Hz<br/>幅度: ${value}`);
                                }
                            } else {
                                result.push(`${seriesName}<br/>序号: ${dataIndex + 1}<br/>值: ${value}`);
                            }
                        });
                        return result.join('<br/>');
                    }
                },
                legend: {
                    data: series.map(s => s.name),
                    right: 10,
                    top: 10
                },
                toolbox: {
                    feature: {
                        saveAsImage: { title: '💾保存' },
                        dataZoom: { title: { zoom: '🔍缩放', back: '↩️还原' } },
                        restore: { title: '🔄重置' }
                    },
                    itemSize: 15,
                    itemGap: 10,
                    left: 20,
                    top: 20,
                    orient: 'vertical'
                },
                graphic: {
                    type: 'text',
                    right: 20,
                    top: 100,
                    style: {
                        text: '',
                        fill: '#666',
                        fontSize: 12,
                        lineHeight: 18
                    },
                    z: 100
                }
            };
        }

        function getSubtitle() {
            const isExcel = appState.currentType === 'excel';
            return [
                `😊系数x：${document.getElementById('coefficient').value}`,
                `数据格式：${document.getElementById(isExcel ? 'dataFormatExcel' : 'dataFormatTxt').value === 'hex' ? '16进制' : '10进制'}`,
                `字节序：${document.getElementById(isExcel ? 'endianExcel' : 'endianTxt').value === 'big' ? '高位' : '低位'}`,
                `符号标志位：${document.getElementById(isExcel ? 'signBitExcel' : 'signBitTxt').value || '31'}`,
                `选择列：${document.getElementById(isExcel ? 'columns' : 'txtColumns').value || '前4列'}`
            ].join(' | ');
        }

        // 初始化应用
        function init() {
            initEventListeners();
            initChartEvents(mainChart, 'main');
            initChartClick();
        }

        // 启动应用
        init();
    </script>
</body>
